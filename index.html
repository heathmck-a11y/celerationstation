<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Celeration Station</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' aria-hidden='true'%3E%3Crect x='1' y='1' width='38' height='38' rx='9' fill='%23C8DC8A'/%3E%3Cpath d='M8 12H32M8 20H32M8 28H32M14 7V33M22 7V33M30 7V33' stroke='%230C5458' stroke-opacity='.22' stroke-width='1.2'/%3E%3Cpath d='M8 30 L32 11' stroke='%230C5458' stroke-width='3.2' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='27' r='2.6' fill='%230C5458'/%3E%3Ccircle cx='20' cy='21' r='2.6' fill='%230C5458'/%3E%3Ccircle cx='28' cy='14' r='2.6' fill='%230C5458'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #EBF4F3;
    --panel: #FFFFFF;
    --ink: #1B2A2B;
    --muted: #55696A;
    --line: #C4DAD7;
    --blue: #11787A;
    --blue-soft: #DAF0EE;
    --brand-dark: #0C5458;
    --brand-gold: #C8DC8A;
    --known: #2F7D4E;
    --known-bg: #DDF0E3;
    --unknown: #A8323E;
    --unknown-bg: #F6DEE0;
    --none-bg: #E6F0EF;
    --warn-bg: #FFF6DD;
    --warn-line: #E8D49A;
    --font: "Andika", "Century Gothic", "Trebuchet MS", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.5; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--brand-dark); border-bottom: 4px solid var(--brand-gold); color: #fff; }
  header.top h1 { margin: 0; font-family: "Fredoka", var(--font); font-size: 1.45rem; font-weight: 600; letter-spacing: 0.01em; display: flex; align-items: center; gap: 10px; }
  header.top .logo { width: 34px; height: 34px; flex: none; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 12px; color: #D2ECEA; }
  nav button:hover { color: #fff; background: rgba(255,255,255,0.08); }
  nav button[aria-current="page"] { background: var(--brand-gold); color: var(--brand-dark); font-weight: 700; }
  header.top :focus-visible { outline-color: var(--brand-gold); }
  h2 { font-family: "Fredoka", var(--font); font-weight: 600; }

  main { max-width: 1060px; margin: 0 auto; padding: 24px 20px 48px; }
  h2 { font-size: 1.6rem; margin: 0 0 4px; }
  h3 { font-size: 1.15rem; margin: 0 0 10px; }
  p.note { color: var(--muted); margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .spread { justify-content: space-between; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 16px; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
  .btn.danger { color: var(--unknown); border-color: #E3B8BD; }
  .btn.small { padding: 5px 10px; font-size: 0.9rem; }
  .linkbtn { background: none; border: none; color: var(--blue); padding: 0; text-decoration: underline; }
  input[type="text"], input[type="number"], input[type="date"], select {
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: #fff; min-width: 0;
  }
  input[type="text"] { flex: 1 1 220px; }
  input[type="number"] { width: 90px; }
  label.f { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 0.95rem; }
  label.f > input, label.f > select { color: var(--ink); flex: none; }

  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg button { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; padding: 7px 16px 7px 10px; }
  .seg button::before { content: ""; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #9AA8B2; background: #fff; }
  .seg button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 700; }
  .seg button[aria-pressed="true"]::before { border: 5px solid var(--blue); }
  .setup-grid { display: grid; grid-template-columns: max-content 1fr; gap: 0 18px; align-items: start; margin-bottom: 16px; }
  .setup-grid > * { padding: 12px 0; border-top: 1px solid var(--line); }
  .setup-grid > :nth-child(-n+2) { border-top: none; padding-top: 2px; }
  .setup-grid > span { color: var(--muted); font-weight: 700; font-size: 0.95rem; padding-top: 20px; }
  .setup-grid > span:first-child { padding-top: 10px; }
  .setup-grid > span:empty + * { border-top: none; padding-top: 0; }
  .setup-grid > span:empty { border-top: none; padding: 0; }
  .seg.stack { flex-direction: column; align-items: flex-start; }
  @media (max-width: 560px) { .setup-grid { grid-template-columns: 1fr; gap: 4px; } .setup-grid > span { margin-top: 8px; } }

  .student-list { list-style: none; margin: 0; padding: 0; }
  .student-list li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .student-list li:first-child { border-top: none; }
  .student-list li.slim { padding: 3px 0; gap: 8px; }
  .student-list li.slim .slim-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-width: 0; }
  .student-list li.slim .student-name { font-size: 1.02rem; }
  .student-list li.slim .btn { padding: 2px 12px; font-size: 0.88rem; }
  .student-name { font-weight: 700; font-size: 1.1rem; line-height: 1.3; }
  .counts { color: var(--muted); font-size: 0.9rem; line-height: 1.3; }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 700; }

  /* letter picker */
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; margin: 8px 0 14px; }
  .pick button { height: 74px; border-radius: 10px; border: 2px solid var(--line); background: var(--none-bg); color: #8B99A4; padding: 4px; display: flex; align-items: center; justify-content: center; }
  .pick button svg { height: 100%; width: auto; max-width: 100%; }
  .pick.slides { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px; padding-top: 6px; }
  .pick.slides button { height: 86px; position: relative; }
  .pick.slides button::after { content: "×"; position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; line-height: 18px; border-radius: 50%;
    font-size: 1rem; font-weight: 700; color: var(--unknown); background: #fff; border: 1px solid #E3B8BD; }
  .pick.slides button[aria-pressed="false"]::after { content: "+"; color: var(--blue); border-color: var(--line); }
  .pick button[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--ink); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; height: 34px; min-width: 30px; padding: 2px 4px; border-radius: 7px; background: var(--none-bg); color: var(--ink); }
  .chip svg { height: 100%; width: auto; }
  .chip.slide { height: 42px; }
  .chip.err { background: var(--unknown-bg); color: var(--unknown); }
  .chip .n { font-size: 0.8rem; font-weight: 700; margin-left: 2px; }

  /* decision box */
  .decision { border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; border: 1px solid; }
  .decision h3 { margin: 0 0 6px; }
  .decision p { margin: 0 0 8px; }
  .decision ul { margin: 4px 0 0; padding-left: 22px; }
  .decision li { margin-bottom: 3px; }
  .decision .rule { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  .pill { display: inline-block; font-size: 0.8rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; border: 1px solid; }
  .pill.go { background: var(--known-bg); color: var(--known); border-color: #B7DCC3; }
  .pill.keep { background: var(--blue-soft); color: var(--blue); border-color: #B2D9D4; }
  .pill.change { background: var(--warn-bg); color: #7A5A00; border-color: var(--warn-line); }
  .pill.stop { background: var(--unknown-bg); color: var(--unknown); border-color: #E3B8BD; }
  .d-go { background: var(--known-bg); border-color: #B7DCC3; }
  .d-keep { background: var(--blue-soft); border-color: #B2D9D4; }
  .d-change { background: var(--warn-bg); border-color: var(--warn-line); }
  .d-stop { background: var(--unknown-bg); border-color: #E3B8BD; }
  .stats { display: flex; flex-wrap: wrap; gap: 22px; margin: 4px 0 6px; }
  .stat { min-width: 110px; }
  .stat .v { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .stat .k { color: var(--muted); font-size: 0.9rem; }
  .stat.c .v { color: var(--known); }
  .stat.e .v { color: var(--unknown); }

  /* chart */
  .chart-wrap { overflow-x: auto; }
  .chart-wrap svg { display: block; width: 100%; min-width: 640px; height: auto; font-family: var(--font); }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.9rem; color: var(--muted); margin-top: 6px; }

  /* timing screen */
  .run { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
  .run-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .run-bar .who { font-weight: 700; }
  .run-bar .meta { color: var(--muted); }
  .clock { font-size: 2.3rem; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 110px; text-align: center; padding: 4px 16px; border-radius: 12px; background: var(--blue); color: #fff; }
  .clock.low { background: #E08A1E; }
  .clock.done { background: var(--unknown); color: #fff; }
  .timebar { height: 12px; background: #D3E2E0; }
  .timebar > div { height: 100%; background: var(--blue); }
  .timebar.low > div { background: #E08A1E; }
  .timeup { position: fixed; inset: 0; z-index: 40; background: rgba(20, 30, 32, 0.55); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .timeup > div { background: #fff; border-radius: 18px; padding: 28px 34px; text-align: center; max-width: 460px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .timeup .big { font-family: "Fredoka", var(--font); font-size: 3rem; font-weight: 600; color: var(--unknown); line-height: 1.1; margin-bottom: 8px; }
  .msg { padding: 10px 18px; text-align: center; font-weight: 700; }
  .msg.warn { background: var(--warn-bg); border-bottom: 1px solid var(--warn-line); }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 18px; }
  .sheet { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; width: min(100%, 1000px); }
  @media (max-width: 700px) { .sheet { grid-template-columns: repeat(5, 1fr); } }
  .sheet button { background: #fff; border: 2px solid var(--line); border-radius: 12px; height: clamp(48px, calc((100dvh - 320px) / var(--rows, 5)), 120px); padding: 6px; color: var(--ink); display: flex; align-items: center; justify-content: center; position: relative; }
  .sheet button svg { height: 100%; width: auto; max-width: 100%; }
  .sheet button.err { background: var(--unknown-bg); border-color: var(--unknown); color: var(--unknown); }
  .sheet button.err::after { content: "✗"; position: absolute; top: 2px; right: 6px; font-size: 0.9rem; font-weight: 700; }
  /* while the timer runs: quiet = small gray dot only; hidden = no change on the letter */
  .sheet.m-quiet button.err, .sheet.m-hidden button.err { background: #fff; border-color: var(--line); color: var(--ink); }
  .sheet.m-quiet button.err::after { content: ""; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: #A9B5BE; }
  .sheet.m-hidden button.err::after { content: none; }
  .sheet button { -webkit-tap-highlight-color: transparent; }
  .sheet button:focus { outline: none; }
  .sheet button:focus-visible { outline: 3px solid var(--blue); }
  footer.share { display: flex; align-items: center; gap: 12px; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }
  .qr-mini { flex: none; width: 58px; height: 58px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; overflow: hidden; line-height: 0; }
  .qr-mini svg, .qr-big svg { width: 100%; height: 100%; display: block; }
  .qr-big { width: min(260px, 70vw); height: min(260px, 70vw); margin: 0 auto; }
  .rulebox { background: var(--blue-soft); border: 1px solid #B2D9D4; border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; font-size: 0.95rem; }
  .rulebox ul { margin: 6px 0 0; padding-left: 20px; }
  .rulebox li { margin-bottom: 3px; }
  .markcount { font-size: 0.9rem; color: var(--muted); }
  .sheet button.past { opacity: 0.25; }
  .sheet button.last { outline: 4px solid var(--blue); outline-offset: 1px; }
  .sheet-nav { display: flex; gap: 12px; align-items: center; color: var(--muted); }
  .card { background: #fff; border-radius: 22px; border: 2px solid var(--line); width: min(88vw, 460px); height: min(75vw, 390px, 46vh); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 var(--line); }
  .card svg { display: block; height: 90%; width: auto; max-width: 95%; color: var(--ink); }
  .mark-row { display: flex; gap: 16px; width: min(88vw, 460px); }
  .mark { flex: 1; border-radius: 14px; padding: 18px 10px; font-size: 1.25rem; font-weight: 700; border: 2px solid; }
  .mark.no { background: var(--unknown-bg); color: var(--unknown); border-color: #E3B8BD; }
  .mark.yes { background: var(--known-bg); color: var(--known); border-color: #B7DCC3; }
  .keys { font-size: 0.85rem; color: var(--muted); text-align: center; }
  .keys kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: #fff; font-family: inherit; }
  .ready { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; max-width: 620px; }
  .ready ul { padding-left: 22px; margin: 8px 0 16px; }

  .modal-back { position: fixed; inset: 0; background: rgba(30, 43, 55, 0.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--panel); border-radius: 14px; padding: 20px 22px; width: min(440px, 100%); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .modal p { margin: 0 0 14px; }
  .modal input { width: 100%; margin-bottom: 14px; }
  .modal .row { justify-content: flex-end; }
  details summary { cursor: pointer; font-weight: 700; }
</style>
</head>

<div id="app"></div>
<script>
(function () {
  // ---------- ball-and-stick letters (same shapes as the Letter Names and Sounds app) ----------
  // Units: top line y=0, midline y=50, baseline y=100, descender y=150. t is straight; q has a curl.
  const O = (cx) => `M${cx + 25},75 A25,25 0 1 0 ${cx - 25},75 A25,25 0 1 0 ${cx + 25},75`;
  const GLYPHS = {
    a: { c: 25, x: [0, 50], d: O(25) + " M50,50 L50,100" },
    b: { c: 25, x: [0, 50], d: "M0,0 L0,100 " + O(25) },
    c: { c: 21, x: [0, 43], d: "M42.7,57.3 A25,25 0 1 0 42.7,92.7" },
    d: { c: 25, x: [0, 50], d: O(25) + " M50,0 L50,100" },
    e: { c: 25, x: [0, 50], d: "M0,75 L50,75 A25,25 0 1 0 42.7,92.7" },
    f: { c: 21, x: [0, 43], d: "M15,100 L15,22 A18,18 0 0 1 43,8 M0,50 L34,50" },
    g: { c: 25, x: [0, 50], d: O(25) + " M50,50 L50,130 A18,18 0 0 1 14,130" },
    h: { c: 25, x: [0, 50], d: "M0,0 L0,100 M0,75 A25,25 0 0 1 50,75 L50,100" },
    i: { c: 0, x: [0, 0], d: "M0,50 L0,100", dots: [[0, 28]] },
    j: { c: 8, x: [-11, 25], d: "M25,50 L25,130 A18,18 0 0 1 -11,130", dots: [[25, 28]] },
    k: { c: 20, x: [0, 42], d: "M0,0 L0,100 M40,50 L0,76 L42,100" },
    l: { c: 0, x: [0, 0], d: "M0,0 L0,100" },
    m: { c: 40, x: [0, 80], d: "M0,50 L0,100 M0,70 A20,20 0 0 1 40,70 L40,100 M40,70 A20,20 0 0 1 80,70 L80,100" },
    n: { c: 25, x: [0, 50], d: "M0,50 L0,100 M0,75 A25,25 0 0 1 50,75 L50,100" },
    o: { c: 25, x: [0, 50], d: O(25) },
    p: { c: 25, x: [0, 50], d: "M0,50 L0,150 " + O(25) },
    q: { c: 32, x: [0, 78], d: O(25) + " M50,50 L50,132 A14,14 0 0 0 78,132" },
    r: { c: 20, x: [0, 40], d: "M0,50 L0,100 M0,74 A24,24 0 0 1 40,56" },
    s: { c: 23, x: [2, 44], d: "M44,58 C39,49 6,48 6,63 C6,78 44,72 44,88 C44,104 8,103 2,93" },
    t: { c: 15, x: [0, 30], d: "M15,12 L15,100 M0,50 L30,50" },
    u: { c: 25, x: [0, 50], d: "M0,50 L0,75 A25,25 0 0 0 50,75 M50,50 L50,100" },
    v: { c: 25, x: [0, 50], d: "M0,50 L25,100 L50,50" },
    w: { c: 36, x: [0, 72], d: "M0,50 L18,100 L36,50 L54,100 L72,50" },
    x: { c: 23, x: [0, 46], d: "M0,50 L46,100 M46,50 L0,100" },
    y: { c: 25, x: [0, 50], d: "M0,50 L25,100 M50,50 L12,150" },
    z: { c: 23, x: [0, 46], d: "M0,50 L46,50 L0,100 L46,100" },
  };
  const STROKE = 10, VB_W = 130, VB_TOP = -12, VB_H = 174, GAP = 26;
  function glyphParts(g, dx) {
    const dots = (g.dots || []).map(([x, y]) => `<circle cx="${x + dx}" cy="${y}" r="7" fill="currentColor"/>`).join("");
    return `<path transform="translate(${dx},0)" d="${g.d}" fill="none" stroke="currentColor" stroke-width="${STROKE}" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
  }
  // Layout for one item. A slide (consonant + vowel read together) gets an arrow under the letters pointing right.
  const ARROW_Y = 180, SLIDE_EXTRA = 38;
  function glyphLayout(item, arrow) {
    const chars = String(item).split("").filter((ch) => GLYPHS[ch]);
    const offsets = [];
    let minX, vbW, end = 0;
    if (chars.length === 1 && !arrow) { const g = GLYPHS[chars[0]]; minX = g.c - VB_W / 2; vbW = VB_W; offsets.push(0); }
    else {
      let x = 0;
      chars.forEach((ch, i) => { const g = GLYPHS[ch]; const dx = x - g.x[0]; offsets.push(dx); x = dx + g.x[1] + (i < chars.length - 1 ? GAP : 0); });
      end = x; minX = -22; vbW = x + 44;
    }
    let a = null;
    if (arrow) {
      a = { x0: -6, x1: end + 6 };
      const MIN = 84;
      if (a.x1 - a.x0 < MIN) { const mid = (a.x0 + a.x1) / 2; a = { x0: mid - MIN / 2, x1: mid + MIN / 2 }; }
      const right = Math.max(minX + vbW, a.x1 + 12);
      minX = Math.min(minX, a.x0 - 12); vbW = right - minX;
    }
    return { chars, offsets, minX, vbW, vbH: VB_H + (arrow ? SLIDE_EXTRA : 0), arrow: a };
  }
  const arrowPath = (a) => `M${a.x0},${ARROW_Y} L${a.x1},${ARROW_Y} M${a.x1 - 15},${ARROW_Y - 12} L${a.x1},${ARROW_Y} L${a.x1 - 15},${ARROW_Y + 12}`;
  function glyphSVG(item, arrow) {
    const L = glyphLayout(item, arrow);
    const out = L.chars.map((ch, i) => glyphParts(GLYPHS[ch], L.offsets[i])).join("");
    const arr = L.arrow ? `<path d="${arrowPath(L.arrow)}" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>` : "";
    return `<svg viewBox="${L.minX} ${VB_TOP} ${L.vbW} ${L.vbH}" aria-hidden="true">${out}${arr}</svg>`;
  }

    const made = new Date().toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
    text(`${st.name}: ${set.name}`, 16, "bold", 0.02);
    text(`${st.grade ? GRADE_NAMES[st.grade] + ". " : ""}${isSlides(set) ? "Slides" : "Letter sounds"}: ${set.items.join(" ")}. Aim: ${set.aim} correct per minute with ${set.errMax} or fewer errors.${d.cel ? ` Celeration this phase: correct ${celText(d.cel.value)}${d.errCel ? `, errors ${celText(d.errCel.value)}` : ""} per week.` : ""} Printed ${made}.`, 9.5, "normal", 0.08, 70);
    text(`Next step: ${d.title}`, 11, "bold", 0.02);
    if (d.text) text(d.text, 9.5, "normal", 0.06);
    const img = await svgToPng(chartSVG(st, set));
    const w = PW, h = w / img.ratio;
    const room = BOTTOM - y - 0.25;
    const hh = Math.min(h, room), ww = hh * img.ratio;
    doc.addImage(img.src, "PNG", M + (PW - ww) / 2, y, ww, hh);
    y += hh + 0.06;
    text("Dots: correct per minute. X: errors per minute. Dashed vertical lines: phase changes. Short black dashes: record floor (1 per timing).", 8, "normal", 0, 110);

    // page 2: timings and phase notes
    doc.addPage(); y = M;
    text(`Timings: ${st.name}, ${set.name}`, 14, "bold", 0.1);
    const cols = [["Date", 1.3], ["Length", 0.9], ["Correct", 0.8], ["Errors", 0.8], ["Correct/min", 1.0], ["Errors/min", 0.9], ["Accuracy", 0.8], ["Error letters", 3.5]];
    const rowH = 0.24;
    const row = (cells, head, faint) => {
      if (y + rowH > BOTTOM) { doc.addPage(); y = M; row(cols.map((c) => c[0]), true); }
      if (head) { doc.setFillColor(235); doc.rect(M, y, PW, rowH, "F"); }
      doc.setFont("helvetica", head ? "bold" : "normal"); doc.setFontSize(9); doc.setTextColor(faint ? 140 : 0);
      let x = M;
      cells.forEach((t, i) => { doc.text(doc.splitTextToSize(String(t), cols[i][1] - 0.08)[0] || "", x + 0.05, y + rowH / 2, { baseline: "middle" }); x += cols[i][1]; });
      doc.setDrawColor(210); doc.setLineWidth(0.01); doc.line(M, y + rowH, M + PW, y + rowH);
      y += rowH;
    };
    row(cols.map((c) => c[0]), true);
    list.forEach((s) => row([
      fmtDate(s.date) + (counted.has(s) ? "" : " *"), fmtLen(s.seconds), s.correct, s.errors,
      r1(perMin(s.correct, s.seconds)), r1(perMin(s.errors, s.seconds)),
      s.correct + s.errors ? Math.round(100 * s.correct / (s.correct + s.errors)) + "%" : "",
      Object.entries(s.errorItems || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + (v > 1 ? ` x${v}` : "")).join(", ") || (s.manual ? "typed-in score" : "none"),
    ], false, !counted.has(s)));
    if (list.some((s) => !counted.has(s))) { y += 0.06; text(`* Not counted: another timing that day counts (${data.settings.sameDay === "first" ? "first" : "best"} timing of the day).`, 8.5, "normal", 0, 110); }
    const phases = phasesFor(st, set.id);
    y += 0.2;
    text("Phase changes", 12, "bold", 0.04);
    if (phases.length) phases.forEach((p) => text(`${fmtDate(p.date)}: ${p.note || "Phase change"}`, 10, "normal", 0));
    else text("None.", 10, "normal", 0);
    if (d.missedList.length) { y += 0.15; text("Missed in the current phase", 12, "bold", 0.04); text(d.missedList.slice(0, 15).map((k) => `${withClue(k)}: ${d.missed[k]}`).join("; "), 10, "normal", 0); }
    const fname = `${st.name}-${set.name}-chart`.replace(/[^A-Za-z0-9 _-]/g, "").trim().replace(/\s+/g, "-");
    await download(`${fname}-${todayStr()}.pdf`, doc.output("blob"), "application/pdf");
  }
  async function busy(btn, fn) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Making PDF…";
    try { await fn(); }
    catch (e) { console.error(e); tell("The PDF could not be made. Check your internet connection and try again."); }
    finally { btn.disabled = false; btn.textContent = label; }
  }
  async function printProbe(btn, set, gradeKey, studentName, sid) {
    const opts = { onePage: data.settings.probeLen !== "full", count: data.settings.probeCount || 1 };
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Making PDF…";
    try { await probePdf(set, gradeKey, studentName, sid, opts); render(); }
    catch (e) { console.error(e); tell("The PDF could not be made. Check your internet connection and try again."); }
    finally { btn.disabled = false; btn.textContent = label; }
  }
  const gradeSelect = (id, value) => `<select id="${id}" aria-label="Grade level for the paper probe">${Object.entries(PROBE_GRADES).map(([k, g]) => `<option value="${k}" ${String(value || data.settings.probeGrade) === k ? "selected" : ""}>${g.label}</option>`).join("")}</select>`;
  const probeOptsHTML = () => `<select id="probeLen" aria-label="Probe length">
      <option value="one" ${data.settings.probeLen !== "full" ? "selected" : ""}>1 page per probe</option>
      <option value="full" ${data.settings.probeLen === "full" ? "selected" : ""}>Full length (2 to 3 pages)</option></select>
    <select id="probeCount" aria-label="How many probes">${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${Number(data.settings.probeCount || 1) === n ? "selected" : ""}>${n} probe${n > 1 ? "s" : ""}</option>`).join("")}</select>`;
  const GRADE_NAMES = { K: "Kindergarten", "1": "1st grade", "2": "2nd grade" };

  // ---------- celeration math ----------
  function fitLine(pts) {
    const n = pts.length; if (n < 2) return null;
    const mx = pts.reduce((s, p) => s + p.x, 0) / n, my = pts.reduce((s, p) => s + p.y, 0) / n;
    let sxx = 0, sxy = 0;
    pts.forEach((p) => { sxx += (p.x - mx) ** 2; sxy += (p.x - mx) * (p.y - my); });
    if (sxx === 0) return null;
    const b = sxy / sxx;
    return { a: my - b * mx, b };
  }
  // log10 of a rate; zero counts are placed below the record floor (half of 1 per timing)
  const logRate = (count, seconds) => Math.log10(count > 0 ? perMin(count, seconds) : perMin(0.5, seconds));
  function celeration(sessions, key) {
    const pts = sessions.map((s) => ({ x: dayNum(s.date), y: logRate(s[key], s.seconds) }));
    const f = fitLine(pts);
    if (!f) return null;
    return { fit: f, x0: pts[0].x, x1: pts[pts.length - 1].x, value: Math.pow(10, f.b * 7) };
  }
  const celText = (v) => v >= 1 ? `×${v.toFixed(2)}` : `÷${(1 / v).toFixed(2)}`;
  const MIN_POINTS = 5, MIN_DAYS = 7, CEL_WINDOW = 10;

  // When there is more than one timing on a day, which one counts (Settings).
  function charted(list) {
    const rule = data.settings.sameDay || "best";
    if (rule === "all") return list.slice();
    const byDay = {};
    list.forEach((x) => {
      const cur = byDay[x.date];
      if (!cur) { byDay[x.date] = x; return; }
      if (rule === "best") {
        const a = perMin(x.correct, x.seconds), b = perMin(cur.correct, cur.seconds);
        if (a > b || (a === b && perMin(x.errors, x.seconds) < perMin(cur.errors, cur.seconds))) byDay[x.date] = x;
      }
    });
    return list.filter((x) => byDay[x.date] === x);
  }
  const chartedFor = (st, setId) => charted(sessionsFor(st, setId));

  // Retention: after the aim is met on 2 days in a row, the first timing 7+ days later is the retention check.
  const RET_DAYS = 7, RET_LATE = 14, RET_HOLD = 0.9;
  const addDays = (date, n) => { const d = dayToDate(dayNum(date) + n); return d.toISOString().slice(0, 10); };
  function retentionInfo(st, set) {
    const list = chartedFor(st, set.id);
    const met = (x) => perMin(x.correct, x.seconds) >= set.aim && perMin(x.errors, x.seconds) <= set.errMax;
    let info = { status: "none" }, i = 1;
    while (i < list.length) {
      if (met(list[i]) && met(list[i - 1]) && list[i].date !== list[i - 1].date) {
        const aimDate = list[i].date, dueDate = addDays(aimDate, RET_DAYS);
        const check = list.slice(i + 1).find((x) => x.date >= dueDate);
        if (!check) return { status: "due", aimDate, dueDate, lateDate: addDays(aimDate, RET_LATE), set, st };
        const held = perMin(check.correct, check.seconds) >= RET_HOLD * set.aim && perMin(check.errors, check.seconds) <= set.errMax;
        if (held) return { status: "retained", aimDate, dueDate, check, set, st };
        info = { status: "lost", aimDate, dueDate, check, set, st };
        i = list.indexOf(check) + 2;   // look for the aim to be met again after the check
        continue;
      }
      i++;
    }
    return info;
  }

  function currentPhase(st, setId) {
    const all = chartedFor(st, setId);
    const phases = phasesFor(st, setId);
    const start = phases.length ? phases[phases.length - 1].date : null;
    return { all, phase: start ? all.filter((s) => s.date >= start) : all, phaseStart: start, phaseNote: phases.length ? phases[phases.length - 1].note : "" };
  }

  // ---------- decision rules ----------
  function decide(st, set) {
    const minCel = Number(data.settings.minCel) || 1.25;
    const { all, phase } = currentPhase(st, set.id);
    const n = phase.length;
    const cRate = (s) => perMin(s.correct, s.seconds), eRate = (s) => perMin(s.errors, s.seconds);
    const acc = (s) => (s.correct + s.errors) ? s.correct / (s.correct + s.errors) : 0;
    const metAim = (s) => cRate(s) >= set.aim && eRate(s) <= set.errMax;
    const missed = {};
    phase.forEach((s) => Object.entries(s.errorItems || {}).forEach(([k, v]) => (missed[k] = (missed[k] || 0) + v)));
    const missedList = Object.keys(missed).sort((a, b) => missed[b] - missed[a] || itemSort(a, b));
    const out = { missed, missedList, n, cel: null, errCel: null };

    if (!all.length) return Object.assign(out, { tone: "keep", title: "Take a first timing",
      text: `No timings yet for ${set.name}. The first timing shows where ${st.name} is starting.`,
      bullets: ["Do a short warm-up with the letters first, then one timing.", "Many teachers take 2 or 3 timings on separate days before choosing a practice plan."],
      rule: "No data yet." });
    if (!n) return Object.assign(out, { tone: "keep", title: "New phase started",
      text: "A phase change line was drawn. Take a timing to begin this phase.", bullets: [], rule: "No timings since the last phase change line." });

    const last = phase[n - 1], prev = n > 1 ? phase[n - 2] : null;

    // 1. Retention: aim reached, check due, or check done
    const ret = retentionInfo(st, set);
    out.retention = ret;
    const today = todayStr();
    if (ret.status === "retained") {
      return Object.assign(out, { tone: "go", title: "Retained. This set is fluent.",
        text: `${st.name} reached the aim on ${fmtDate(ret.aimDate)} and held it on the retention check on ${fmtDate(ret.check.date)} (${r1(perMin(ret.check.correct, ret.check.seconds))} correct per minute).`,
        bullets: [isSlides(set) ? "Move on to a new set, for example slides with a new vowel or new consonants." : "Move on to a new set, or make a new named set that adds 2 or 3 new letter sounds.", "Keep a few of these letters in the warm-up for the next set."],
        rule: `Rule: on the first timing ${RET_DAYS} or more days after the aim was reached, at least ${Math.round(RET_HOLD * 100)}% of the aim (${r1(RET_HOLD * set.aim)}) and errors at or under the limit.` });
    }
    if (ret.status === "due") {
      const now = today >= ret.dueDate, late = today > ret.lateDate;
      return Object.assign(out, { tone: "go", title: now ? `Aim reached. Retention check due${late ? " (overdue)" : ""}.` : `Aim reached. Retention check on or after ${fmtDate(ret.dueDate)}.`,
        text: `${st.name} met the aim (${set.aim} correct and ${set.errMax} or fewer errors per minute) on 2 days in a row, ending ${fmtDate(ret.aimDate)}.`,
        bullets: [now ? "Do one timing on this set today, with no warm-up or practice first." : `Don't practice this set until then. On or after ${fmtDate(ret.dueDate)}, do one timing with no warm-up or practice first.`,
          isSlides(set) ? "Meanwhile, move on to a new set, for example slides with a new vowel or new consonants." : "Meanwhile, move on to a new set, or make a new named set that adds 2 or 3 new letter sounds.",
          "Keep a few of these letters in the warm-up for the next set."],
        rule: `Rule: aim met on 2 timings in a row, on different days. The retention check is the first timing ${RET_DAYS} or more days later.` });
    }
    if (ret.status === "lost" && last === ret.check) {
      return Object.assign(out, { tone: "change", title: "Not retained. Return to practice on this set.",
        text: `On the retention check (${fmtDate(ret.check.date)}) ${st.name} had ${r1(perMin(ret.check.correct, ret.check.seconds))} correct and ${r1(perMin(ret.check.errors, ret.check.seconds))} errors per minute. The aim is ${set.aim}.`,
        bullets: ["Go back to daily practice and timings on this set until the aim is met again on 2 days in a row.",
          "Draw a phase change line (for example: retention practice) so the decisions use only the new timings.",
          ...(ret.check.errorItems && Object.keys(ret.check.errorItems).length ? [`Correct the missed sounds first: ${Object.keys(ret.check.errorItems).map(withClue).join(", ")}.`] : [])],
        rule: `Rule: the retention check was below ${Math.round(RET_HOLD * 100)}% of the aim, or errors were above the limit.` });
    }
    // 2. Aim met once
    if (metAim(last)) {
      return Object.assign(out, { tone: "go", title: "Aim met once. Confirm it.",
        text: `${st.name} met the aim on ${fmtDate(last.date)}.`,
        bullets: ["Do one more timing on a different day. If the aim is met again, move on to new letters."],
        rule: "Rule: the aim must be met on 2 timings, on different days, before moving on." });
    }
    // 3. Very low or very inaccurate: step back
    if (cRate(last) < 5 || acc(last) < 0.5) {
      return Object.assign(out, { tone: "stop", title: "Step back. Accuracy before speed.",
        text: `On the last timing ${st.name} had ${r1(cRate(last))} correct and ${r1(eRate(last))} errors per minute (${Math.round(acc(last) * 100)}% accurate). Speed practice now will mostly practice errors.`,
        bullets: [
          `Teach the missed sounds directly (model, lead, test)${missedList.length ? ": " + missedList.slice(0, 6).map(withClue).join(", ") : ""}.`,
          "Make a smaller named set of 3 to 5 sounds, mostly known ones with 1 or 2 new ones.",
          "Practice untimed until the student is accurate, then return to timings. Draw a phase change line when you change the set or the teaching."],
        rule: "Rule: fewer than 5 correct per minute, or less than 50% accurate, on the latest timing." });
    }
    // 4. Errors above the limit on 2 timings in a row
    if (prev && eRate(last) > set.errMax && eRate(prev) > set.errMax && acc(last) < 0.9 && acc(prev) < 0.9) {
      return Object.assign(out, { tone: "change", title: "Fix errors before building speed.",
        text: `Errors were above ${set.errMax} per minute on the last 2 timings.`,
        bullets: [
          `Error letters in this phase: ${missedList.length ? missedList.slice(0, 6).map((k) => `${withClue(k)}, missed ${missed[k]}`).join("; ") : "not recorded (typed-in score)"}.`,
          "Before each timing, correct those sounds: model the sound, have the student say it, then mix it with known letters.",
          "If the same letters keep coming up, take them out into a smaller set for a few days.",
          "Draw a phase change line when you change the plan."],
        rule: "Rule: errors above the error limit and accuracy below 90% on 2 timings in a row." });
    }
    // 5. Not enough data for a celeration line yet
    const windowed = phase.slice(-CEL_WINDOW);
    const span = dayNum(windowed[windowed.length - 1].date) - dayNum(windowed[0].date);
    if (n < MIN_POINTS || span < MIN_DAYS) {
      if (n >= 4) {
        const before = Math.max(...phase.slice(0, n - 3).map(cRate));
        const recent = Math.max(...phase.slice(n - 3).map(cRate));
        if (recent <= before) {
          return Object.assign(out, { tone: "change", title: "No new best in 3 timings. Change something.",
            text: `${st.name}'s best in this phase is ${r1(before)} correct per minute, and the last 3 timings did not beat it.`,
            bullets: changeOptions(missedList),
            rule: "Rule: 3 timings in a row without a new personal best." });
        }
      }
      const need = Math.max(MIN_POINTS - n, 0);
      return Object.assign(out, { tone: "keep", title: "Keep going with the current plan.",
        text: need ? `${need} more timing${need === 1 ? "" : "s"} in this phase before a celeration line can be drawn.` : `The timings so far cover ${span} day${span === 1 ? "" : "s"}. A celeration line needs at least a week of data.`,
        bullets: ["Practice daily: a few short practice sprints, then one timing. Chart every timing.",
          "Look for a new personal best every few days."],
        rule: `Rule: at least ${MIN_POINTS} timings across ${MIN_DAYS} or more days are needed to judge celeration.` });
    }
    // 6. Judge celeration
    const cel = celeration(windowed, "correct"), errCel = celeration(windowed, "errors");
    out.cel = cel; out.errCel = errCel;
    if (!cel) return Object.assign(out, { tone: "keep", title: "Keep going.", text: "", bullets: [], rule: "" });
    const errNote = errCel && errCel.value > 1.1 && eRate(last) > set.errMax ? ` Errors are also going up (${celText(errCel.value)} per week).` : "";
    if (cel.value >= minCel) {
      let proj = "";
      if (cel.fit.b > 0) {
        const yNow = cel.fit.a + cel.fit.b * cel.x1;
        const days = (Math.log10(set.aim) - yNow) / cel.fit.b;
        if (days > 0) proj = ` At this rate ${st.name} would reach ${set.aim} correct per minute in about ${Math.max(1, Math.round(days / 7))} week${Math.round(days / 7) > 1 ? "s" : ""}.`;
      }
      return Object.assign(out, { tone: "keep", title: "On track. Keep the current plan.",
        text: `Correct sounds are growing at ${celText(cel.value)} per week (the minimum is ×${minCel}).${proj}${errNote}`,
        bullets: errNote ? ["Keep the plan, and add error correction for the missed sounds before each timing."] : ["Keep practicing and charting daily."],
        rule: `Rule: celeration of correct sounds at or above ×${minCel} per week, from the last ${windowed.length} timings in this phase.` });
    }
    return Object.assign(out, { tone: "change", title: "Growth is too slow. Change something.",
      text: `Correct sounds are growing at ${celText(cel.value)} per week, below the minimum of ×${minCel}.${errNote}`,
      bullets: changeOptions(missedList),
      rule: `Rule: celeration of correct sounds below ×${minCel} per week, from the last ${windowed.length} timings in this phase.` });
  }
  function changeOptions(missedList) {
    return ["Change one thing at a time, then draw a phase change line on the chart so you can see whether it helped. Some options:",
      "Shorter, more frequent practice: several 10 to 15 second sprints in place of longer practice.",
      `Add error correction before practice${missedList.length ? " for " + missedList.slice(0, 5).map(withClue).join(", ") : ""}: model, lead, test.`,
      "Make the set smaller, or swap out letters that look or sound alike (b and d, e and i).",
      "Add motivation: have the student try to beat their last score and see the chart.",
      "Check that the student is accurate when untimed. If not, go back to teaching the sounds."];
  }
  function decisionHTML(d) {
    const cls = { go: "d-go", keep: "d-keep", change: "d-change", stop: "d-stop" }[d.tone];
    const bullets = d.bullets.slice();
    const lead = bullets.length && /Some options:$/.test(bullets[0]) ? bullets.shift() : "";
    return `<div class="decision ${cls}">
      <h3>What to do next: ${esc(d.title)}</h3>
      ${d.text ? `<p>${esc(d.text)}</p>` : ""}
      ${lead ? `<p>${esc(lead)}</p>` : ""}
      ${bullets.length ? `<ul>${bullets.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
      ${d.rule ? `<div class="rule">${esc(d.rule)}</div>` : ""}
    </div>`;
  }

  // ---------- Standard Celeration Chart (daily, semi-log) ----------
  function chartSVG(st, set) {
    const sessions = sessionsFor(st, set.id), phases = phasesFor(st, set.id);
    const full = data.settings.range === "full";
    const yMin = full ? -3 : -1, yMax = 3, DAYS = 140;
    const W = 1000, H = full ? 640 : 520, L = 64, R = 70, T = 44, B = 52;
    const pw = W - L - R, ph = H - T - B;
    const firstDay = sessions.length ? dayNum(sessions[0].date) : dayNum(todayStr());
    const lastDay = sessions.length ? dayNum(sessions[sessions.length - 1].date) : firstDay;
    const sunday = (n) => n - ((n + 4) % 7);   // day 0 (Jan 1 1970) was a Thursday
    let start = sunday(firstDay);
    if (lastDay - start > DAYS - 7) start = sunday(lastDay - (DAYS - 14));
    const X = (n) => L + ((n - start) / DAYS) * pw;
    const Y = (v) => T + ((yMax - Math.log10(v)) / (yMax - yMin)) * ph;
    const YL = (lg) => T + ((yMax - lg) / (yMax - yMin)) * ph;
    let g = "";
    // vertical lines
    for (let d = 0; d <= DAYS; d++) {
      const x = L + (d / DAYS) * pw, wk = d % 7 === 0;
      g += `<line x1="${x}" y1="${T}" x2="${x}" y2="${T + ph}" stroke="${wk ? "#8FB3CC" : "#DCE8EF"}" stroke-width="${wk ? 1 : 0.6}"/>`;
    }
    // horizontal lines
    for (let e = yMin; e < yMax; e++) {
      for (let k = 1; k <= 9; k++) {
        const v = k * Math.pow(10, e), y = Y(v);
        g += `<line x1="${L}" y1="${y}" x2="${L + pw}" y2="${y}" stroke="${k === 1 ? "#8FB3CC" : "#DCE8EF"}" stroke-width="${k === 1 ? 1 : 0.6}"/>`;
      }
    }
    g += `<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="none" stroke="#6E93AE" stroke-width="1.2"/>`;
    // y labels
    const lab = (v) => v >= 1 ? String(v) : String(v).replace(/^0/, "");
    for (let e = yMin; e <= yMax; e++) {
      [1, 5].forEach((k) => {
        const v = k * Math.pow(10, e); if (Math.log10(v) > yMax + 1e-9) return;
        g += `<text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="${k === 1 ? 13 : 11}" fill="${k === 1 ? "#1E2B37" : "#5B6B78"}">${lab(+v.toPrecision(3))}</text>`;
      });
    }
    g += `<text transform="translate(16 ${T + ph / 2}) rotate(-90)" text-anchor="middle" font-size="13" fill="#5B6B78">Count per minute</text>`;
    // x labels: days at bottom, dates at top
    for (let d = 0; d <= DAYS; d += 14) g += `<text x="${L + (d / DAYS) * pw}" y="${T + ph + 18}" text-anchor="middle" font-size="12" fill="#5B6B78">${d}</text>`;
    g += `<text x="${L + pw / 2}" y="${H - 8}" text-anchor="middle" font-size="13" fill="#5B6B78">Successive calendar days (heavy lines are Sundays)</text>`;
    for (let d = 0; d <= DAYS; d += 28) g += `<text x="${L + (d / DAYS) * pw}" y="${T - 8}" text-anchor="middle" font-size="12" fill="#5B6B78">${fmtShort(start + d)}</text>`;
    // aim lines
    const aimY = Y(set.aim);
    g += `<line x1="${L}" y1="${aimY}" x2="${L + pw}" y2="${aimY}" stroke="#2F7D4E" stroke-width="1.5" stroke-dasharray="8 5"/>`;
    g += `<text x="${L + pw + 6}" y="${aimY + 4}" font-size="12" fill="#2F7D4E">Aim ${set.aim}</text>`;
    if (set.errMax > 0 && Math.log10(set.errMax) > yMin) {
      const ey = Y(set.errMax);
      g += `<line x1="${L}" y1="${ey}" x2="${L + pw}" y2="${ey}" stroke="#A8323E" stroke-width="1" stroke-dasharray="3 5"/>`;
      g += `<text x="${L + pw + 6}" y="${ey + 4}" font-size="12" fill="#A8323E">Error limit ${set.errMax}</text>`;
    }
    // phase lines
    phases.forEach((p) => {
      const x = X(dayNum(p.date) - 0.5);
      if (x < L || x > L + pw) return;
      g += `<line x1="${x}" y1="${T}" x2="${x}" y2="${T + ph}" stroke="#1E2B37" stroke-width="2" stroke-dasharray="6 4"/>`;
      g += `<text transform="translate(${x + 5} ${T + 10}) rotate(90)" font-size="12" fill="#1E2B37">${esc((p.note || "Phase change").slice(0, 40))}</text>`;
    });
    // group sessions by phase
    const bounds = phases.map((p) => p.date);
    const groups = [];
    const counted = new Set(charted(sessions));
    sessions.filter((s) => counted.has(s)).forEach((s) => {
      const gi = bounds.filter((b) => s.date >= b).length;
      (groups[gi] = groups[gi] || []).push(s);
    });
    const inChart = (n) => n >= start && n <= start + DAYS;
    const pt = (s, key) => {
      const c = s[key];
      const v = c > 0 ? perMin(c, s.seconds) : perMin(0.5, s.seconds);
      return { x: X(dayNum(s.date)), y: Math.max(T, Math.min(T + ph, Y(v))) };
    };
    // record floor (1 count per timing)
    const floors = new Set();
    sessions.forEach((s) => {
      const n = dayNum(s.date); if (!inChart(n)) return;
      const key = n + ":" + s.seconds; if (floors.has(key)) return; floors.add(key);
      const y = Y(perMin(1, s.seconds));
      if (y <= T + ph) g += `<line x1="${X(n) - 4}" y1="${y}" x2="${X(n) + 4}" y2="${y}" stroke="#1E2B37" stroke-width="1.5"/>`;
    });
    // extra same-day timings that don't count: drawn faintly
    sessions.filter((s) => !counted.has(s) && inChart(dayNum(s.date))).forEach((s) => {
      const c = pt(s, "correct"), e = pt(s, "errors");
      const tip = `${fmtDate(s.date)} (not counted, another timing that day counts): ${r1(perMin(s.correct, s.seconds))} correct, ${r1(perMin(s.errors, s.seconds))} errors per minute`;
      g += `<g opacity="0.3"><title>${esc(tip)}</title><circle cx="${c.x}" cy="${c.y}" r="4" fill="none" stroke="#2D5F8A" stroke-width="1.5"/><path d="M${e.x - 4},${e.y - 4} L${e.x + 4},${e.y + 4} M${e.x + 4},${e.y - 4} L${e.x - 4},${e.y + 4}" stroke="#A8323E" stroke-width="1.5"/></g>`;
    });
    groups.forEach((grp) => {
      if (!grp) return;
      const shown = grp.filter((s) => inChart(dayNum(s.date)));
      ["correct", "errors"].forEach((key) => {
        if (shown.length > 1) {
          g += `<polyline points="${shown.map((s) => { const p = pt(s, key); return `${p.x},${p.y}`; }).join(" ")}" fill="none" stroke="${key === "correct" ? "#2D5F8A" : "#A8323E"}" stroke-width="1" opacity="0.45"/>`;
        }
      });
      // celeration lines from the last 10 timings of each phase with enough data
      const w = grp.slice(-CEL_WINDOW);
      const spanD = w.length ? dayNum(w[w.length - 1].date) - dayNum(w[0].date) : 0;
      if (w.length >= MIN_POINTS && spanD >= MIN_DAYS) {
        ["correct", "errors"].forEach((key) => {
          const c = celeration(w, key); if (!c) return;
          const xa = Math.max(c.x0, start), xb = Math.min(c.x1 + 7, start + DAYS);
          const ya = YL(c.fit.a + c.fit.b * xa), yb = YL(c.fit.a + c.fit.b * xb);
          const color = key === "correct" ? "#2D5F8A" : "#A8323E";
          g += `<line x1="${X(xa)}" y1="${ya}" x2="${X(xb)}" y2="${yb}" stroke="${color}" stroke-width="2.5" ${key === "errors" ? 'stroke-dasharray="7 4"' : ""}/>`;
          g += `<text x="${X(xb) + 4}" y="${yb + (key === "correct" ? -6 : 14)}" font-size="13" font-weight="700" fill="${color}">${celText(c.value)}</text>`;
        });
      }
      shown.forEach((s) => {
        const tip = `${fmtDate(s.date)}: ${r1(perMin(s.correct, s.seconds))} correct, ${r1(perMin(s.errors, s.seconds))} errors per minute (${s.correct} and ${s.errors} in ${fmtLen(s.seconds)})`;
        const c = pt(s, "correct"), e = pt(s, "errors");
        g += `<g><title>${esc(tip)}</title><circle cx="${c.x}" cy="${c.y}" r="5" fill="#2D5F8A"/></g>`;
        g += `<g><title>${esc(tip)}</title><path d="M${e.x - 5},${e.y - 5} L${e.x + 5},${e.y + 5} M${e.x + 5},${e.y - 5} L${e.x - 5},${e.y + 5}" stroke="#A8323E" stroke-width="2.4" stroke-linecap="round"/></g>`;
      });
    });
    return `<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Daily standard celeration chart for ${esc(st.name)}, ${esc(set.name)}">${g}</svg>`;
  }

  // ---------- views ----------
  function shell(inner, current) {
    const banner = !loading && mode === "local" ? `<div class="panel" style="background:var(--warn-bg);border-color:var(--warn-line)">
      <strong>Saving in this browser only.</strong> ${noAccessNote ? "Your access to this shared app doesn't allow saving to Claude. " : ""}Results stay on this device and are lost if the browser's data is cleared. Make a backup on the Backup page now and then.</div>` : "";
    return `<header class="top"><h1><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="9" fill="#C8DC8A"/><path d="M8 12H32M8 20H32M8 28H32M14 7V33M22 7V33M30 7V33" stroke="#0C5458" stroke-opacity=".22" stroke-width="1.2"/><path d="M8 30 L32 11" stroke="#0C5458" stroke-width="3.2" stroke-linecap="round"/><circle cx="12" cy="27" r="2.6" fill="#0C5458"/><circle cx="20" cy="21" r="2.6" fill="#0C5458"/><circle cx="28" cy="14" r="2.6" fill="#0C5458"/></svg>Celeration Station</h1>
      <nav aria-label="Main">
        <button data-nav="today" ${current === "today" ? 'aria-current="page"' : ""}>Today</button>
        <button data-nav="home" ${current === "home" ? 'aria-current="page"' : ""}>Students</button>
        <button data-nav="sets" ${current === "sets" ? 'aria-current="page"' : ""}>Letter sets</button>
        <button data-nav="backup" ${current === "backup" ? 'aria-current="page"' : ""}>Backup</button>
        <button data-nav="data" ${current === "data" ? 'aria-current="page"' : ""}>Settings</button>
      </nav></header>
      <main>
        ${saveError ? `<div class="panel" style="border-color:#E3B8BD;background:var(--unknown-bg)"><div class="row spread"><span>Some changes have not saved to Claude yet. Check your internet connection.</span><button class="btn small" id="retrySave">Try again</button></div></div>` : ""}
        ${banner}
        ${!loading && current !== "backup" && backupDue() ? `<div class="panel" style="background:var(--warn-bg);border-color:var(--warn-line)">
          <div class="row spread"><span><strong>Time for a backup.</strong> ${data.settings.lastBackup ? `Last backup: ${new Date(data.settings.lastBackup).toLocaleDateString()}.` : "No backup yet."} There are new timings since then.</span>
          <button class="btn primary small" data-nav="backup">Back up now</button></div></div>` : ""}
        ${loading ? `<p class="note">Loading…</p>` : inner}
        ${loading ? "" : shareFooter()}
      </main>`;
  }

  function homeView() {
    const list = sortedStudents().filter((s) => !s.hidden);
    const hidden = sortedStudents().filter((s) => s.hidden);
    const rows = list.map((s) => {
      const lastS = s.sessions.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0))[0];
      const set = lastS && getSet(lastS.setId);
      const info = lastS ? `Last timing ${fmtDate(lastS.date)}: ${r1(perMin(lastS.correct, lastS.seconds))} correct per minute on ${esc(set ? set.name : lastS.setName || "a deleted set")}` : "No timings yet";
      return `<li class="slim"><div class="slim-text"><span class="student-name">${esc(s.name)}</span>${s.grade ? `<span class="counts">${GRADE_NAMES[s.grade]}</span>` : ""}<span class="counts">${info}</span></div>
        <div class="row"><button class="btn primary small" data-open="${s.id}">Open</button></div></li>`;
    }).join("");
    return shell(`<h2>Students</h2>
      <p class="note">Open a student to do a timing, see their celeration chart, and get the next step. ${mode === "claude" ? "Saving to your Claude account." : ""}</p>
      <div class="panel"><div class="row">
        <input type="text" id="newName" placeholder="Student name" aria-label="Student name" autocomplete="off">
        <button class="btn primary" id="addStudent">Add student</button></div></div>
      <div class="panel">${list.length ? `<ul class="student-list">${rows}</ul>` : `<p class="note" style="margin:0">${hidden.length ? "All students are hidden." : "Add your first student above to begin."}</p>`}</div>
      ${hidden.length ? `<details class="panel"><summary>Hidden students (${hidden.length})</summary>
        <p class="note" style="margin:8px 0 4px">Their timings are saved, but they are left out of the Today page.</p>
        <ul class="student-list">${hidden.map((s) => `<li><span class="student-name" style="color:var(--muted)">${esc(s.name)}</span>
          <div class="row"><button class="btn small" data-open="${s.id}">Open</button><button class="btn small" data-unhide="${s.id}">Unhide</button></div></li>`).join("")}</ul></details>` : ""}`, "home");
  }

  // ---------- Today: every student's next step ----------
  const TONE_RANK = { stop: 0, change: 1, go: 2, keep: 3 };
  const TONE_LABEL = { stop: "Step back", change: "Change something", go: "Move on or check", keep: "Keep going" };
  function todayRows() {
    const today = todayStr();
    const rows = [], retention = [], none = [];
    sortedStudents().filter((s) => !s.hidden).forEach((st) => {
      const lastS = st.sessions.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0))[0];
      const set = lastS && getSet(lastS.setId);
      if (!set) { none.push(st); }
      else {
        const d = decide(st, set);
        let rank = TONE_RANK[d.tone];
        if (d.retention && d.retention.status === "due" && today >= d.retention.dueDate) rank = 1.5;
        rows.push({ st, set, d, last: lastS, rank });
      }
      // retention checks on every set this student has used
      sortedSets().filter((x) => st.sessions.some((y) => y.setId === x.id)).forEach((x) => {
        const r = retentionInfo(st, x);
        if (r.status === "due") retention.push(r);
        else if ((r.status === "retained" || r.status === "lost") && dayNum(today) - dayNum(r.check.date) <= 30) retention.push(r);
      });
    });
    return { rows, retention, none };
  }
  function todayView() {
    const { rows, retention, none } = todayRows();
    const today = todayStr();
    const sorted = rows.slice().sort(ui.todaySort === "name" ? (a, b) => a.st.name.localeCompare(b.st.name)
      : (a, b) => a.rank - b.rank || a.st.name.localeCompare(b.st.name));
    const pill = (tone, text) => `<span class="pill ${tone}">${esc(text)}</span>`;
    const body = sorted.map(({ st, set, d, last }) => {
      const stale = dayNum(today) - dayNum(last.date);
      return `<tr>
        <td><button class="linkbtn" data-open="${st.id}">${esc(st.name)}</button>${st.grade ? `<br><small class="counts">${GRADE_NAMES[st.grade]}</small>` : ""}</td>
        <td>${esc(set.name)}</td>
        <td>${fmtDate(last.date)}${stale >= 7 ? `<br><small style="color:var(--unknown)">${stale} days ago</small>` : ""}</td>
        <td>${r1(perMin(last.correct, last.seconds))} / ${r1(perMin(last.errors, last.seconds))}</td>
        <td>${d.cel ? celText(d.cel.value) : `<span class="counts">not yet</span>`}</td>
        <td>${pill(d.tone, TONE_LABEL[d.tone])}<div style="margin-top:4px">${esc(d.title)}</div></td>
      </tr>`;
    }).join("");
    const retRows = retention.sort((a, b) => (a.status === "due" ? 0 : 1) - (b.status === "due" ? 0 : 1) || (a.dueDate || "").localeCompare(b.dueDate || "")).map((r) => {
      let status;
      if (r.status === "due") status = today > r.lateDate ? pill("stop", "Overdue") : today >= r.dueDate ? pill("change", "Due now") : pill("keep", `Due ${fmtDate(r.dueDate)}`);
      else if (r.status === "retained") status = pill("go", `Held on ${fmtDate(r.check.date)}`);
      else status = pill("stop", `Not held on ${fmtDate(r.check.date)}`);
      return `<tr><td><button class="linkbtn" data-open="${r.st.id}" data-openset="${r.set.id}">${esc(r.st.name)}</button></td><td>${esc(r.set.name)}</td><td>${fmtDate(r.aimDate)}</td><td>${status}</td></tr>`;
    }).join("");
    return shell(`<h2>Today</h2>
      <p class="note">Each student's next step on the set they were timed on most recently. Students who need a change are listed first.</p>
      <div class="panel">
        ${rows.length ? `<div class="row spread" style="margin-bottom:8px"><span class="counts">${rows.length} student${rows.length === 1 ? "" : "s"}</span>
          <div class="seg" role="group"><button data-todaysort="need" aria-pressed="${ui.todaySort !== "name"}">Sort by need</button><button data-todaysort="name" aria-pressed="${ui.todaySort === "name"}">Sort by name</button></div></div>
          <div class="table-wrap"><table><thead><tr><th>Student</th><th>Set</th><th>Last timing</th><th>Correct / errors per min</th><th>Celeration</th><th>Next step</th></tr></thead><tbody>${body}</tbody></table></div>`
          : `<p class="note" style="margin:0">No timings yet.</p>`}
        ${none.length ? `<p class="counts" style="margin:12px 0 0">No timings yet: ${none.map((x) => `<button class="linkbtn" data-open="${x.id}">${esc(x.name)}</button>`).join(", ")}</p>` : ""}
      </div>
      <div class="panel"><h3>Retention checks</h3>
        <p class="note" style="margin-bottom:8px">After a student meets the aim on 2 days in a row, the first timing ${RET_DAYS} or more days later is the retention check. Do it with no warm-up or practice first. Checks are overdue after ${RET_LATE} days. Results from the last 30 days are shown.</p>
        ${retRows ? `<div class="table-wrap"><table><thead><tr><th>Student</th><th>Set</th><th>Aim reached</th><th>Retention check</th></tr></thead><tbody>${retRows}</tbody></table></div>` : `<p class="note" style="margin:0">None right now.</p>`}
      </div>`, "today");
  }

  const SETUP_KEYS = ["seconds", "mode", "sprintSeconds", "sprintMode"];
  const pref = (st, key) => st && st.setup && st.setup[key] !== undefined ? st.setup[key] : data.settings[key];
  function currentSetup(st) {
    const out = {};
    SETUP_KEYS.forEach((k) => (out[k] = pref(st, k)));
    const sid = ui.startSet[st.id] || (st.setup && st.setup.setId);
    if (sid && getSet(sid)) out.setId = sid;
    out.kind = kindOf(st);
    return out;
  }
  function copySetupDialog(st) {
    const others = sortedStudents().filter((x) => x.id !== st.id);
    const su = currentSetup(st), set = su.setId && getSet(su.setId);
    const summary = [`Timing: ${su.kind === "slides" ? "slides" : "letter sounds"}`, set ? `${isSlides(set) ? "Slide" : "Letter"} set: ${set.name}` : null, st.grade ? `Grade: ${GRADE_NAMES[st.grade]}` : null,
      `Timing length: ${fmtLen(su.seconds)}`, `Show letters: ${su.mode === "cards" ? "one at a time (computer)" : su.mode === "paper" ? "printed probe (student reads from paper)" : "full page (computer)"}`, `Sprint length: ${fmtLen(su.sprintSeconds)}`].filter(Boolean);
    const back = document.createElement("div");
    back.className = "modal-back"; back.id = "modal";
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <p><strong>Copy ${esc(st.name)}'s setup</strong></p>
      <ul style="margin:0 0 12px;padding-left:20px;color:var(--muted)">${summary.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      <label class="f" style="margin-bottom:10px">Copy to<select id="cpTarget">
        ${others.map((x) => `<option value="${x.id}">${esc(x.name)}${x.hidden ? " (hidden)" : ""}</option>`).join("")}
        <option value="__new" ${others.length ? "" : "selected"}>New student…</option></select></label>
      <label class="f" id="cpNewWrap" style="margin-bottom:10px;${others.length ? "display:none" : ""}">New student's name<input type="text" id="cpName" autocomplete="off"></label>
      <p class="counts" style="margin:0 0 14px">Only the setup is copied. Timings, phase change lines, and charts stay with ${esc(st.name)}.</p>
      <div class="row"><button class="btn" id="cpCancel">Cancel</button><button class="btn primary" id="cpOk">Copy setup</button></div></div>`;
    document.body.appendChild(back);
    const sel = back.querySelector("#cpTarget"), wrap = back.querySelector("#cpNewWrap"), name = back.querySelector("#cpName");
    const done = () => { back.remove(); document.removeEventListener("keydown", key, true); };
    const key = (e) => { if (e.key === "Escape") { e.preventDefault(); done(); } else if (e.key === "Enter") { e.preventDefault(); ok(); } };
    sel.onchange = () => { wrap.style.display = sel.value === "__new" ? "" : "none"; if (sel.value === "__new") name.focus(); };
    const ok = () => {
      let target;
      if (sel.value === "__new") {
        const n = name.value.trim();
        if (!n) { name.focus(); return; }
        target = { id: uid(), name: n, sessions: [], phases: [] };
        data.students.push(target);
      } else target = getStudent(sel.value);
      if (!target) return;
      target.setup = Object.assign({}, su);
      if (st.grade) target.grade = st.grade;
      if (su.setId) { ui.startSet[target.id] = su.setId; ui.chartSet[target.id] = su.setId; }
      save(); done(); render();
      tell(`Copied ${st.name}'s setup to ${target.name}.`);
    };
    back.querySelector("#cpOk").onclick = ok;
    back.querySelector("#cpCancel").onclick = done;
    document.addEventListener("keydown", key, true);
    (others.length ? sel : name).focus();
  }

  const setKind = (x) => (x && x.kind === "slides" ? "slides" : "letters");
  function kindOf(st) {
    if (st.setup && st.setup.kind) return st.setup.kind;
    const sid = ui.startSet[st.id] || (st.setup && st.setup.setId);
    return sid && getSet(sid) ? setKind(getSet(sid)) : "letters";
  }
  function setOptions(selected, list) {
    return (list || sortedSets()).map((s) => `<option value="${s.id}" ${s.id === selected ? "selected" : ""}>${esc(s.name)} (${s.items.length})</option>`).join("");
  }

  function studentView() {
    const st = getStudent(view.id);
    if (!st) { view = { name: "home" }; return homeView(); }
    const setsUsed = sortedSets().filter((x) => st.sessions.some((s) => s.setId === x.id));
    const lastS = st.sessions.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0))[0];
    const kind = kindOf(st);
    const kindSets = sortedSets().filter((x) => setKind(x) === kind);
    const kindWord = kind === "slides" ? "slide" : "letter";
    let startSet = ui.startSet[st.id] || (st.setup && getSet(st.setup.setId) ? st.setup.setId : null) || (lastS && getSet(lastS.setId) ? lastS.setId : null);
    if (!startSet || !kindSets.some((x) => x.id === startSet)) {
      const def = kind === "letters" && kindSets.find((x) => x.id === ALL_ID);
      startSet = def ? def.id : kindSets[0] ? kindSets[0].id : null;
    }
    let chartSet = ui.chartSet[st.id] || startSet || (lastS && lastS.setId);
    if (!getSet(chartSet)) chartSet = startSet;
    const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, label]) => `<button data-setting="${key}" data-val="${v}" aria-pressed="${String(data.settings[key]) === String(v)}">${label}</button>`).join("")}</div>`;
    // per-student choices (saved with the student, copied by "Copy setup")
    const sseg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, label]) => `<button data-ssetting="${key}" data-val="${v}" aria-pressed="${String(pref(st, key)) === String(v)}">${label}</button>`).join("")}</div>`;
    const ss = startSet && getSet(startSet);
    const isPaper = pref(st, "mode") === "paper";
    const paperProbes = ss ? probesFor(st, ss.id) : [];

    const kindRow = `<span>What are you timing?</span><div class="seg" role="group">
            <button data-kindpick="letters" aria-pressed="${kind === "letters"}">Letter sounds</button>
            <button data-kindpick="slides" aria-pressed="${kind === "slides"}">Slides</button></div>`;
    const startPanel = kindSets.length ? `<div class="panel">
        <h3>Do a timing</h3>
        <div class="setup-grid">
          ${kindRow}
          <span>${kind === "slides" ? "Slide set" : "Letter set"}</span><div class="row"><select id="startSet" aria-label="${kindWord} set">${setOptions(startSet, kindSets)}</select>
            <button class="btn small" id="newSetFromStudent">Make a new ${kindWord} set</button></div>
          <span></span><div>${ss ? chips(ss.items, "", isSlides(ss)) : ""}</div>
          <span>Timing length</span>${sseg("seconds", [[30, "30 seconds"], [60, "1 minute"]])}
          <span>Show letters</span>${sseg("mode", [["sheet", "Full page (computer)"], ["cards", "One at a time (computer)"], ["paper", "Printed probe (student reads from paper)"]]).replace('class="seg"', 'class="seg stack"')}
          ${isPaper ? `<span>Printed probe</span><div><div class="row" style="gap:8px;margin-bottom:8px">${gradeSelect("probeGrade", st.grade)}${probeOptsHTML()}</div>
            <button class="btn" id="printProbe">Print paper probe (PDF)</button></div>` : ""}
        </div>
        ${isPaper ? (paperProbes.length ? `<div class="row" style="margin-bottom:12px">
            <label class="f" style="flex-direction:row;align-items:center;gap:8px">Probe the student has<select id="paperProbe">${paperProbes.map((p) => `<option value="${p.id}">${esc(probeLabel(p))}</option>`).join("")}</select></label></div>
          <p class="note" style="margin:-4px 0 12px">The student reads from the printed probe. Your screen shows the same letters in the same order and layout, so you time and mark errors on the computer.</p>
          <div class="row"><button class="btn primary" id="startPaper">Get ready</button><button class="linkbtn" id="toggleManual">${ui.showManual ? "Hide manual entry" : "Enter a paper timing manually"}</button></div>`

    const sprintPanel = kindSets.length ? `<div class="panel">

          ${(ui.sprints[st.id] || []).length ? `<span class="counts">Today's sprints (correct/errors): ${ui.sprints[st.id].map((x) => `${x.correct}/${x.errors}`).join(", ")}</span>` : ""}</div>
      </div>` : "";

    let chartPart = "";
    const cs = chartSet && getSet(chartSet);
    if (cs) {
      const d = decide(st, cs);
      const sess = sessionsFor(st, cs.id).slice().reverse();
      const phases = phasesFor(st, cs.id);
      const { phaseStart } = currentPhase(st, cs.id);
      const chooser = setsUsed.length > 1 || (setsUsed.length === 1 && setsUsed[0].id !== cs.id)
        ? `<label class="f" style="flex-direction:row;align-items:center;gap:8px">Chart for <select id="chartSet">${setsUsed.concat(setsUsed.some((x) => x.id === cs.id) ? [] : [cs]).map((x) => `<option value="${x.id}" ${x.id === cs.id ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>` : "";
      const countedSet = new Set(chartedFor(st, cs.id));
      const rows = sess.map((s) => `<tr${countedSet.has(s) ? "" : ' style="color:var(--muted)"'}>
          <td>${fmtDate(s.date)}${countedSet.has(s) ? "" : "<br><small>not counted</small>"}</td><td>${fmtLen(s.seconds)}</td>
          <td>${s.correct} (${r1(perMin(s.correct, s.seconds))}/min)</td>
          <td>${s.errors} (${r1(perMin(s.errors, s.seconds))}/min)</td>
          <td>${s.correct + s.errors ? Math.round(100 * s.correct / (s.correct + s.errors)) + "%" : ""}</td>
          <td>${Object.keys(s.errorItems || {}).length ? Object.entries(s.errorItems).sort((a, b) => b[1] - a[1]).map(([k, v]) => esc(k) + (v > 1 ? ` (${v})` : "")).join(", ") : s.manual ? "typed-in score" : "none"}</td>
          <td><button class="btn small danger" data-delsession="${s.id}">Delete</button></td></tr>`).join("");
      chartPart = `
        <div class="row spread" style="margin:26px 0 10px"><h2 style="margin:0">${esc(cs.name)}</h2>${chooser}</div>
        ${decisionHTML(d)}
        <div class="panel">
          <div class="row spread" style="margin-bottom:8px">
            <div class="counts">Aim: ${cs.aim} correct per minute with ${cs.errMax} or fewer errors. ${d.cel ? `Celeration this phase: correct ${celText(d.cel.value)}${d.errCel ? `, errors ${celText(d.errCel.value)}` : ""} per week.` : ""}</div>
            <div class="row">${seg("range", [["close", "Close-up"], ["full", "Full chart"]])}<button class="btn small" id="chartPdf" data-set="${cs.id}">Download chart (PDF)</button></div>
          </div>
          <div class="chart-wrap">${chartSVG(st, cs)}</div>
          <div class="legend">
            <span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#2D5F8A"/></svg> Correct per minute</span>
            <span><svg width="12" height="12"><path d="M1,1 L11,11 M11,1 L1,11" stroke="#A8323E" stroke-width="2.4"/></svg> Errors per minute</span>
            <span>Short black dash: record floor (1 per timing). Points below it are zeros.</span>
            <span>Dashed vertical line: phase change.</span>
            ${data.settings.sameDay !== "all" ? `<span>Faint marks: extra timings on the same day that don't count (${data.settings.sameDay === "first" ? "the first timing of the day counts" : "the best timing of the day counts"}).</span>` : ""}
          </div>
          ${d.missedList.length ? `<p class="letters-line" style="margin:12px 0 0"><strong>Missed in this phase:</strong> ${d.missedList.slice(0, 12).map((k) => `${esc(withClue(k))}, ${d.missed[k]}`).join("; ")}</p>` : ""}
        </div>
        <div class="panel">
          <h3>Phase change lines</h3>
          <p class="note" style="margin-bottom:10px">Draw one whenever you change the teaching (new practice routine, smaller set, error correction). Decisions after the line use only the timings after it.${phaseStart ? ` Current phase started ${fmtDate(phaseStart)}.` : ""}</p>
          <div class="row" style="align-items:flex-end">
            <label class="f">Date<input type="date" id="pDate" value="${todayStr()}"></label>

            <button class="btn" id="addPhase">Add phase change line</button>
          </div>
          ${phases.length ? `<ul class="student-list" style="margin-top:10px">${phases.map((p) => `<li><span>${fmtDate(p.date)}: ${esc(p.note || "Phase change")}</span><button class="btn small danger" data-delphase="${p.id}">Remove</button></li>`).join("")}</ul>` : ""}
        </div>
        <div class="panel"><h3>Timings for ${esc(cs.name)}</h3>
          ${rows ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Length</th><th>Correct</th><th>Errors</th><th>Accuracy</th><th>Error letters</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="note" style="margin:0">No timings yet for this set.</p>`}
        </div>`;
    }
    return shell(`
      <p style="margin:0 0 10px"><button class="linkbtn" data-nav="home">All students</button></p>
      <div class="row spread" style="margin-bottom:16px"><div class="row"><h2 style="margin:0">${esc(st.name)}</h2>

      ${st.hidden ? `<div class="panel" style="background:var(--blue-soft);border-color:#B2D9D4">This student is hidden. Their timings are saved, but they are left out of the Today page.</div>` : ""}
      ${startPanel}
      ${sprintPanel}
      ${chartPart}`, "home");
  }

  function setsView() {
    const list = sortedSets();
    const used = (id) => data.students.reduce((n, s) => n + s.sessions.filter((x) => x.setId === id).length, 0);
    return shell(`<h2>Letter sets</h2>
      <p class="note">A named set is the group of letter sounds or slides you time. Use the same set each day so the chart shows growth on the same skill.</p>

      ${list.length ? list.map((s) => `<div class="panel">
        <div class="row spread" style="margin-bottom:8px"><div><div class="student-name">${esc(s.name)}</div>
          <div class="counts">${isSlides(s) ? `Slides. ${s.items.length} slide${s.items.length === 1 ? "" : "s"}` : `${s.items.length} sound${s.items.length === 1 ? "" : "s"}`}. Aim ${s.aim} correct per minute, ${s.errMax} or fewer errors. ${used(s.id)} timing${used(s.id) === 1 ? "" : "s"} saved.</div></div>
          <div class="row"><button class="btn small" data-probeset="${s.id}">Print paper probe</button><button class="btn small" data-editset="${s.id}">Edit</button><button class="btn small" data-copyset="${s.id}">Copy</button><button class="btn small danger" data-delset="${s.id}">Delete</button></div></div>
        ${chips(s.items, "", isSlides(s))}</div>`).join("") : `<div class="panel"><p class="note" style="margin:0">No sets yet.</p></div>`}`, "sets");
  }

  const CONSONANTS = LETTERS.filter((l) => !VOWELS.includes(l)).concat(DIGRAPHS);
  const slideCombos = (d) => d.cons.slice().sort((a, b) => CONSONANTS.indexOf(a) - CONSONANTS.indexOf(b))
    .flatMap((c) => VOWELS.filter((v) => d.vows.includes(v)).map((v) => c + v));
  const draftItems = (d) => d.kind === "slides" ? slideCombos(d).filter((x) => !d.off.includes(x)) : d.items.slice().sort(itemSort);
  function setEditView() {
    const sel = new Set(draft.items);
    const btn = (x) => `<button data-pick="${x}" aria-pressed="${sel.has(x)}" aria-label="${x}">${glyphSVG(x)}</button>`;
    const editingUsed = draft.id && data.students.some((s) => s.sessions.some((x) => x.setId === draft.id));
    const kindSeg = editingUsed ? "" : `<div class="panel"><h3>Kind of set</h3><div class="seg" role="group">
        <button data-kind="letters" aria-pressed="${draft.kind !== "slides"}">Letter sounds</button>
        <button data-kind="slides" aria-pressed="${draft.kind === "slides"}">Slides (consonant + short vowel)</button></div>
        ${draft.kind === "slides" ? `<p class="note" style="margin:10px 0 0">A slide is a consonant and a vowel read together, the way they sound at the start of a CVC word, so the vowel is short (ma as in map). Each slide shows an arrow under the letters pointing right.</p>` : ""}</div>`;
    if (draft.kind === "slides") {
      const cs = new Set(draft.cons), vs = new Set(draft.vows), off = new Set(draft.off);
      const combos = slideCombos(draft), on = combos.filter((x) => !off.has(x));
      return shell(`
      <p style="margin:0 0 10px"><button class="linkbtn" id="cancelSet">Cancel</button></p>
      <h2>${draft.id ? "Edit slide set" : "Make a slide set"}</h2>
      <p class="note">Pick the consonants and the vowels. The app makes every consonant-vowel slide from them. Tap a slide to leave it out. Then name the set so you can choose it again.</p>
      ${kindSeg}
      <div class="panel">
        <div class="row" style="margin-bottom:6px"><h3 style="margin:0">Consonants</h3>
          <button class="btn small" data-cpreset="bak1">BAK 1 consonants</button>
          <button class="btn small" data-cpreset="clear">Clear</button></div>
        <div class="pick">${CONSONANTS.map((x) => `<button data-pickc="${x}" aria-pressed="${cs.has(x)}" aria-label="${x}">${glyphSVG(x)}</button>`).join("")}</div>
        <h3>Vowels</h3>
        <div class="pick">${VOWELS.map((x) => `<button data-pickv="${x}" aria-pressed="${vs.has(x)}" aria-label="${x}">${glyphSVG(x)}</button>`).join("")}</div>
      </div>
      <div class="panel">
        <h3>Slides (${on.length} of ${combos.length} included)</h3>
        ${combos.length ? `<p class="note" style="margin:0 0 6px">Tap × to take a slide out. Tap + to put it back. ce and ci are left out automatically because the c is soft. Tap + if you want them.</p>
          <div class="pick slides">${combos.map((x) => `<button data-slide="${x}" aria-pressed="${!off.has(x)}" aria-label="${off.has(x) ? `Put ${x} back` : `Take ${x} out`}" title="${off.has(x) ? "Left out. Tap to put back." : "Tap to take out."}">${glyphSVG(x, true)}</button>`).join("")}</div>`
          : `<p class="note" style="margin:0">Pick at least one consonant and one vowel.</p>`}
      </div>
      ${setDetailsPanel(editingUsed, "for example: Slides, m s t with a and i")}`, "sets");
    }
    return shell(`
      <p style="margin:0 0 10px"><button class="linkbtn" id="cancelSet">Cancel</button></p>
      <h2>${draft.id ? "Edit letter set" : "Make a letter set"}</h2>
      <p class="note">Tap the letter sounds to include. Then name the set so you can choose it again for later timings.</p>
      ${kindSeg}
      <div class="panel">
        <div class="row" style="margin-bottom:6px"><span class="counts">Quick picks:</span>
          <button class="btn small" data-preset="bak1">BAK 1 letters</button>
          <button class="btn small" data-preset="all">All 26 letters</button>
          <button class="btn small" data-preset="vowels">Short vowels</button>
          <button class="btn small" data-preset="clear">Clear</button></div>
        <div class="pick">${LETTERS.map(btn).join("")}</div>
        <h3>Digraphs</h3>
        <div class="pick">${DIGRAPHS.map(btn).join("")}</div>
        <p class="counts" style="margin:0">${sel.size} selected${sel.size ? ": " + draft.items.slice().sort(itemSort).join(", ") : ""}</p>
      </div>
      ${setDetailsPanel(editingUsed, "for example: BAK 1, first 6 sounds")}`, "sets");
  }
  function setDetailsPanel(editingUsed, placeholder) {
    return `<div class="panel">
        <div class="row" style="align-items:flex-end">
          <label class="f" style="flex:1 1 260px">Set name<input type="text" id="setName" value="${esc(draft.name)}" placeholder="${esc(placeholder)}" autocomplete="off"></label>

        ${editingUsed ? `<p class="note" style="margin:-6px 0 14px">This set already has timings. If you add or remove ${draft.kind === "slides" ? "slides" : "letters"}, the chart will mix two different skills. Use Copy on the Letter sets page to make a new set instead.</p>` : ""}
        <div class="row"><button class="btn primary" id="saveSet">Save set</button><button class="btn" id="cancelSet2">Cancel</button></div>
      </div>`;
  }

  function dataView() {
    const s = data.settings;
    return shell(`<h2>Settings and data</h2>
      <div class="panel"><h3>Decision rules</h3>
        <div class="row" style="align-items:flex-end;margin-bottom:10px">
          <label class="f">Minimum celeration per week (×)<input type="number" id="minCel" step="0.05" min="1" value="${s.minCel}"></label>
          <button class="btn" id="saveSettings">Save</button></div>

          <button data-setting="markStyle" data-val="red" aria-pressed="${s.markStyle === "red"}">Red</button></div>
        <p class="note" style="margin:0 0 16px">How a tapped error looks while the timer is running. All marks show in red after time is up.</p>
        <h3>Picture clues</h3>
        <div class="seg" role="group" style="margin-bottom:6px">
          <button data-setting="showClues" data-val="on" aria-pressed="${s.showClues !== false}">Show Sunform picture clues for missed letters</button>
          <button data-setting="showClues" data-val="off" aria-pressed="${s.showClues === false}">Don't show picture clues</button></div>

        <h3>The rules</h3>
        <p class="note" style="margin:0">The app checks these rules in order after every timing. Rules 3 to 7 use only timings since the last phase change line:</p>
        <ol style="margin:6px 0 0;padding-left:22px">
          <li>Aim met on 2 timings in a row, on different days: aim reached. Move on to new letters. The first timing on this set ${RET_DAYS} or more days later is the retention check (overdue after ${RET_LATE} days).</li>
          <li>Retention check at or above ${Math.round(RET_HOLD * 100)}% of the aim, with errors at or under the limit: retained, so the set is fluent. Below that: return to practice on the set.</li>
          <li>Aim met once: confirm with one more timing on another day.</li>
          <li>Fewer than 5 correct per minute, or under 50% accurate: step back to accuracy and a smaller set.</li>
          <li>Errors above the set's error limit, and under 90% accurate, on 2 timings in a row: correct errors before building speed.</li>
          <li>Fewer than 5 timings, or less than 7 days of data: keep going. Exception: after 4 or more timings, 3 in a row without a new personal best means change something.</li>
          <li>Celeration of correct sounds (from the last 10 timings) at or above the minimum: on track, with a projected date for the aim. Below the minimum: change something and draw a phase change line.</li>
        </ol>
      </div>
      <div class="panel"><h3>Erase</h3><p class="note" style="margin-bottom:10px">Make a backup first (Backup page).</p><button class="btn danger" id="eraseAll">Erase all students, timings, and sets</button></div>`, "data");
