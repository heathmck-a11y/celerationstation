  }

  // ---------- timing screens ----------
  const PAGE = 40;
  function runView() {
    const st = getStudent(run.sid), set = getSet(run.setId);
    const left = Math.max(0, run.remaining);
    const clock = `${Math.floor(Math.ceil(left) / 60)}:${String(Math.ceil(left) % 60).padStart(2, "0")}`;
    const bar = `<div class="run-bar">
      <div><span class="who">${esc(st.name)}</span> <span class="meta">${esc(set.name)}, ${run.practice ? "practice sprint, " : ""}${run.paper ? `paper probe ${run.probeCode}, ` : ""}${fmtLen(run.seconds)}</span></div>
      <div class="row">${run.mode === "sheet" && run.state === "running" ? `<span class="markcount">Errors: ${run.errors.size}</span>
        <button class="btn small" id="undoMark" ${run.markOrder.length ? "" : "disabled"}>Undo last mark</button>` : ""}
        <span class="clock ${run.state === "review" ? "done" : run.state === "running" && left <= 10 ? "low" : ""}" id="clock">${run.state === "review" ? "0:00" : clock}</span>
        <button class="btn small" id="cancelRun">Cancel</button></div></div>
      ${run.state !== "ready" ? `<div class="timebar ${run.state === "running" && left <= 10 ? "low" : ""}" id="timebar" aria-hidden="true"><div style="width:${run.state === "review" ? 0 : Math.max(0, Math.min(100, (left / run.seconds) * 100))}%"></div></div>` : ""}
      ${run.flash ? `<div class="timeup" id="timeupBox"><div role="alertdialog" aria-label="Time is up"><div class="big">Time's up!</div>
        <p style="margin:0 0 16px">Stop the student. Then tap the last ${run.slide ? "slide" : "letter"} they answered.</p>
        <button class="btn primary" id="timeupOk" style="font-size:1.1rem;padding:10px 26px">OK</button></div></div>` : ""}`;
    if (run.state === "ready") {
      return `<div class="run">${bar}<div class="stage"><div class="ready">
        <h2>${run.practice ? "Practice sprint" : "Ready"}</h2>
        ${run.practice ? `<p class="note">${fmtLen(run.seconds)} sprint. The score shows at the end and is not saved to the chart.</p>` : ""}
        ${run.paper ? `<ul>
          <li>Give the student printed probe <strong>${esc(run.probeCode)}</strong>. Check that the code at the top of their page matches.</li>
          <li>The student reads from the paper. Your screen shows the same page, in the same order.</li>
          <li>Tap a ${run.slide ? "slide" : "letter"} to mark an error. Tap it again to undo, for example if the student self-corrects.</li>
          <li>${run.probePages > 1 ? "Tap Next page when the student turns the page." : "If the student finishes the page before time is up, they start again at the top. Tap Back to top."}</li>
          <li>When time is up, tap the last ${run.slide ? "slide" : "letter"} the student answered.</li></ul>`
        : run.mode === "sheet" ? `<ul>
          <li>The student ${run.slide ? "says each slide" : "says the sound of each letter"}, reading across each row.</li>
          <li>Tap a ${run.slide ? "slide" : "letter"} to mark an error. Tap it again to undo, for example if the student self-corrects.</li>
          <li>Tap Next page when the student reaches the end of the page.</li>
          <li>When time is up, tap the last ${run.slide ? "slide" : "letter"} the student answered.</li></ul>`
        : `<ul><li>One ${run.slide ? "slide" : "letter"} shows at a time. The student ${run.slide ? "says it" : "says its sound"}.</li>
          <li>Tap Correct or Incorrect. Keyboard: <kbd>→</kbd> or <kbd>C</kbd> correct, <kbd>←</kbd> or <kbd>X</kbd> incorrect, <kbd>Backspace</kbd> undo.</li>
          <li>If you tapped Incorrect and the student self-corrects, tap Undo, then Correct.</li></ul>`}
        ${run.mode === "sheet" && !run.paper ? `<p class="counts" style="margin:0 0 6px">Error marks while the timer runs:</p>
        <div class="seg" role="group" style="margin-bottom:14px">
          <button data-setting="markStyle" data-val="quiet" aria-pressed="${(data.settings.markStyle || "hidden") === "quiet"}">Small gray dot</button>
          <button data-setting="markStyle" data-val="hidden" aria-pressed="${(data.settings.markStyle || "hidden") === "hidden"}">Hidden</button>
          <button data-setting="markStyle" data-val="red" aria-pressed="${data.settings.markStyle === "red"}">Red</button></div>
        <p class="note" style="margin-top:-6px">With Hidden, the letter doesn't change when you tap it. The error count and Undo last mark are at the top by the timer. All marks show in red when time is up so you can check them.</p>` : ""}
        ${errorRuleHTML(run.slide)}
        <p class="note">The timer starts when you press Start.</p>
        <button class="btn primary" id="go" style="font-size:1.2rem;padding:12px 28px">Start</button>
      </div></div></div>`;
    }
    if (run.mode === "cards") {
      const item = run.items[run.cardIdx];
      return `<div class="run">${bar}<div class="stage">
        <div class="card" role="img" aria-label="${esc(item)}">${glyphSVG(item, run.slide)}</div>
        <div class="mark-row"><button class="mark no" id="markNo">Incorrect</button><button class="mark yes" id="markYes">Correct</button></div>
        <div class="keys">Correct ${run.log.filter((x) => x.ok).length}. Incorrect ${run.log.filter((x) => !x.ok).length}. <button class="linkbtn" id="undoCard" ${run.log.length ? "" : "disabled"}>Undo</button></div>
      </div></div>`;
    }
    // sheet
    const PG = run.pageSize || PAGE;
    const pages = Math.ceil(run.items.length / PG);
    const from = run.page * PG;
    const cells = run.items.slice(from, from + PG).map((x, i) => {
      const idx = from + i;
      const cls = [run.errors.has(idx) ? "err" : "", run.last !== null && idx > run.last ? "past" : "", run.last === idx ? "last" : ""].join(" ");
      return `<button class="${cls}" data-cell="${idx}" aria-label="${esc(x)}${run.errors.has(idx) ? ", marked error" : ""}">${glyphSVG(x, run.slide)}</button>`;
    }).join("");
    let msg = "";
    if (run.state === "review") {
      msg = run.tap === "last"
        ? `<div class="msg warn">Time! Tap the last letter the student answered.${run.last !== null ? ` <button class="btn small primary" id="toResults">Done</button>` : ""}</div>`
        : `<div class="msg warn">Tap letters to fix error marks. <button class="btn small primary" id="toResults">Done</button></div>`;
      msg += `<div class="row" style="justify-content:center;padding:8px"><div class="seg" role="group">
        <button data-tap="last" aria-pressed="${run.tap === "last"}">Mark last letter</button>
        <button data-tap="errors" aria-pressed="${run.tap === "errors"}">Fix error marks</button></div></div>`;
    }
    return `<div class="run">${bar}${msg}<div class="stage">
      <div class="sheet ${!run.paper && run.state === "running" && data.settings.markStyle !== "red" ? "m-" + (data.settings.markStyle || "hidden") : ""}"${run.cols ? ` style="grid-template-columns:repeat(${run.cols},1fr);--rows:${run.rows}"` : ""}>${cells}</div>
      <div class="sheet-nav">
        <button class="btn" id="prevPage" ${run.page === 0 ? "disabled" : ""}>Previous page</button>
        <span>${run.paper ? paperPageLabel() : `Page ${run.page + 1}${run.state === "review" ? ` of ${pages}` : ""}`}</span>
        <button class="btn primary" id="nextPage" ${run.paper && run.page >= pages - 1 ? "disabled" : ""}>${run.paper && run.probePages === 1 ? "Back to top" : "Next page"}</button>
      </div></div></div>`;
  }

  // One error rule for every timing and sprint, so scores are comparable from day to day.
  function paperPageLabel() {
    const pp = run.probePages || 1, pg = run.page % pp, pass = Math.floor(run.page / pp) + 1;
    return `${pp > 1 ? `Student page ${pg + 1} of ${pp}` : "Probe page"}${pass > 1 ? `, time through ${pass}` : ""}`;
  }
  function errorRuleHTML(slide) {
    const w = slide ? "slide" : "letter";
    return `${slide ? `<div class="rulebox" style="background:var(--warn-bg);border-color:var(--warn-line)"><strong>What counts as correct for a slide</strong>
      <ul>
        <li>The student says the slide smoothly as one unit, without sounding it out first. For example, "ma," not "/m/ ... /a/ ... ma."</li>
        <li>If the student sounds out the separate sounds first, mark it as an error, even if they blend it correctly after.</li>
      </ul></div>` : ""}<div class="rulebox"><strong>If the student makes an error or doesn't know it</strong>
      <ul>
        <li><strong>During the timing, don't correct or say the sound.</strong> Mark it as an error and let the student keep going.</li>
        <li>No answer after about 3 seconds: mark it, then point to the next ${w} and say "Next."</li>
        <li>If the student fixes it on their own within about 3 seconds, it counts as correct.</li>
        <li>Don't say "good" or "no" during the timing. Stay neutral.</li>
        <li><strong>Right after the timing, correct the errors.</strong> For each missed ${w}: model ("This says ${slide ? "ma" : "/m/"}"), lead ("Say it with me"), test ("What does it say?").</li>
      </ul></div>`;
  }
  function correctNowHTML(errList, slide) {
    if (!errList.length) return "";
    const w = slide ? "slide" : "letter";
    return `<div class="rulebox" style="margin-top:12px"><strong>Correct these now:</strong> for each missed ${w}, model ("This says ..."), lead ("Say it with me"), test ("What does it say?")${errList.some(([k]) => clueFor(k)) ? ". Use the picture clue shown next to each letter." : "."}</div>`;
  }
  function errorListHTML(errList, arrow) {
    if (!errList.length) return `<p class="note" style="margin:0">None</p>`;
    return `<div class="chip-row" style="gap:10px 16px">${errList.map(([k, v]) => `<span style="display:inline-flex;align-items:center;gap:6px">
      <span class="chip err${arrow ? " slide" : ""}" title="${esc(k)}">${glyphSVG(k, arrow)}${v > 1 ? `<span class="n">${v}</span>` : ""}</span>${clueFor(k) ? `<span class="counts">${esc(clueFor(k))}</span>` : ""}</span>`).join("")}</div>`;
  }
  function sprintView() {
    const r = ui.sprintResult, st = getStudent(r.sid), set = getSet(r.setId);
    const errList = Object.entries(r.errorItems).sort((a, b) => b[1] - a[1] || itemSort(a[0], b[0]));
    const today = ui.sprints[r.sid] || [];
    return shell(`<h2>${esc(st.name)}: practice sprint</h2>
      <p class="note">${esc(set.name)}, ${fmtLen(r.seconds)}. Not saved to the chart.</p>
      <div class="panel">
        <div class="stats">
          <div class="stat c"><div class="v">${r.correct}</div><div class="k">correct (${r1(perMin(r.correct, r.seconds))} per minute)</div></div>
          <div class="stat e"><div class="v">${r.errors}</div><div class="k">errors</div></div>
        </div>
        ${today.length > 1 ? `<p class="counts" style="margin:4px 0 10px">Today's sprints, correct/errors: ${today.map((x) => `${x.correct}/${x.errors}`).join(", ")}</p>` : ""}
        <h3 style="margin-top:12px">Missed</h3>
        ${errorListHTML(errList, isSlides(set))}
        ${correctNowHTML(errList, isSlides(set))}
        <div class="row" style="margin-top:16px"><button class="btn primary" id="againSprint">Another sprint</button>
          <button class="btn" data-open="${st.id}">Back to ${esc(st.name)}</button></div>
      </div>`, "home");
  }

  function resultsView() {
    const p = pending, st = getStudent(p.sid), set = getSet(p.setId);
    const errList = Object.entries(p.errorItems).sort((a, b) => b[1] - a[1] || itemSort(a[0], b[0]));
    return shell(`<h2>${esc(st.name)}: ${esc(set.name)}</h2>
      <p class="note">${fmtLen(p.seconds)} timing. Check the numbers, then save.</p>
      <div class="panel">
        <div class="stats">
          <div class="stat c"><div class="v">${p.correct}</div><div class="k">correct${p.seconds !== 60 ? ` (${r1(perMin(p.correct, p.seconds))} per minute)` : " per minute"}</div></div>
          <div class="stat e"><div class="v">${p.errors}</div><div class="k">errors${p.seconds !== 60 ? ` (${r1(perMin(p.errors, p.seconds))} per minute)` : " per minute"}</div></div>
          <div class="stat"><div class="v">${p.correct + p.errors ? Math.round(100 * p.correct / (p.correct + p.errors)) : 0}%</div><div class="k">accurate</div></div>
        </div>
        <h3 style="margin-top:12px">Error letters</h3>
        ${errorListHTML(errList, isSlides(set))}
        ${correctNowHTML(errList, isSlides(set))}
        <div class="row" style="margin-top:16px;align-items:flex-end">
          <label class="f">Date<input type="date" id="rDate" value="${p.date}"></label>
          <button class="btn primary" id="saveResult">Save and chart</button>
          <button class="btn danger" id="discard">Discard</button>
        </div>
      </div>`, "home");
  }

  // ---------- actions ----------
  function go(name, extra) { view = Object.assign({ name }, extra || {}); render(); window.scrollTo(0, 0); }
  let timerId = null, audioCtx = null;
  function beep() {
    try {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.frequency.value = 880; o.connect(gn); gn.connect(audioCtx.destination);
      gn.gain.setValueAtTime(0.25, audioCtx.currentTime); gn.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
      o.start(); o.stop(audioCtx.currentTime + 0.7);
    } catch (e) { /* no sound */ }
  }
  function startRun(sid, setId, practice, probeId) {
    const set = getSet(setId);
    if (!set || !set.items.length) { tell("Choose a letter set first."); return; }
    const stu = getStudent(sid);
    let mode = practice ? pref(stu, "sprintMode") : pref(stu, "mode");
    if (mode !== "cards") mode = "sheet";
    const probe = probeId ? (data.probes || []).find((p) => p.id === probeId) : null;
    const secs = practice ? (Number(pref(stu, "sprintSeconds")) || 15) : (Number(pref(stu, "seconds")) || 60);
    run = { sid, setId, slide: isSlides(set), practice: !!practice, mode, seconds: secs, state: "ready",
      items: sequence(set.items, mode === "sheet" ? PAGE * 4 : 400), page: 0, errors: new Set(), last: null,
      remaining: secs, cardIdx: 0, log: [], tap: "last", markOrder: [], pageSize: PAGE, cols: null };
    if (probe) {
      const reps = probe.pages === 1 ? 5 : 1;   // one-page probes: the student goes back to the top if they finish
      let items = []; for (let i = 0; i < reps; i++) items = items.concat(probe.items);
      Object.assign(run, { mode: "sheet", paper: true, probeCode: probe.code, items, probePages: probe.pages || 1, pageSize: probe.cols * probe.rows, cols: probe.cols, rows: probe.rows });
    }
    go("run");
  }
  function beginTiming() {
    try { const C = window.AudioContext || window.webkitAudioContext; if (C && !audioCtx) audioCtx = new C(); if (audioCtx && audioCtx.resume) audioCtx.resume(); } catch (e) { /* */ }
    run.state = "running";
    run.endAt = performance.now() + run.seconds * 1000;
    render();
    timerId = setInterval(tick, 100);
  }
  function tick() {
    if (!run || run.state !== "running") { clearInterval(timerId); return; }
    run.remaining = (run.endAt - performance.now()) / 1000;
    if (run.remaining <= 0) { clearInterval(timerId); timeUp(); return; }
    const c = $("clock"), tb = $("timebar"), low = run.remaining <= 10;
    if (c) { const s = Math.ceil(run.remaining); c.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; c.classList.toggle("low", low); }
    if (tb) { tb.firstElementChild.style.width = `${Math.max(0, (run.remaining / run.seconds) * 100)}%`; tb.classList.toggle("low", low); }
  }
  function timeUp() {
    beep(); setTimeout(beep, 350); setTimeout(beep, 700);
    run.remaining = 0;
    if (run.mode === "cards") { finishCards(); return; }
    run.state = "review"; run.tap = "last"; run.flash = true;
    render();
  }
  function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
  function finishCards() {
    const errorItems = {};
    run.log.filter((x) => !x.ok).forEach((x) => (errorItems[x.item] = (errorItems[x.item] || 0) + 1));
    finishRun({ sid: run.sid, setId: run.setId, seconds: run.seconds, mode: "cards", date: todayStr(),
      correct: run.log.filter((x) => x.ok).length, errors: run.log.filter((x) => !x.ok).length, errorItems });
  }
  function finishSheet() {
    const last = run.last;
    const errIdx = [...run.errors].filter((i) => i <= last);
    const errorItems = {};
    errIdx.forEach((i) => (errorItems[run.items[i]] = (errorItems[run.items[i]] || 0) + 1));
    finishRun({ sid: run.sid, setId: run.setId, seconds: run.seconds, mode: run.paper ? "paper" : "sheet", probe: run.probeCode || undefined, date: todayStr(),
      correct: last + 1 - errIdx.length, errors: errIdx.length, errorItems });
  }
  function finishRun(result) {
    const practice = run.practice;
    run = null;
    if (practice) {
      ui.sprintResult = result;
      (ui.sprints[result.sid] = ui.sprints[result.sid] || []).push(result);
      go("sprint");
    } else { pending = result; go("results"); }
  }
  function markCard(ok) {
    if (!run || run.state !== "running" || run.mode !== "cards") return;
    run.log.push({ item: run.items[run.cardIdx], ok });
    run.cardIdx++;
    if (run.cardIdx >= run.items.length) run.items = run.items.concat(sequence(getSet(run.setId).items, 200, run.items[run.items.length - 1]));
    render();
  }
  function undoCard() {
    if (!run || run.state !== "running" || !run.log.length) return;
    run.log.pop(); run.cardIdx--; render();
  }
  function saveSession(p, date) {
    const st = getStudent(p.sid), set = getSet(p.setId);
    st.sessions.push({ id: uid(), at: Date.now(), date, setId: p.setId, setName: set ? set.name : "", seconds: p.seconds,
      correct: p.correct, errors: p.errors, errorItems: p.errorItems || {}, mode: p.mode, manual: !!p.manual, probe: p.probe });
    ui.chartSet[st.id] = p.setId; ui.startSet[st.id] = p.setId;
    st.setup = Object.assign({}, st.setup || {}, { setId: p.setId });
    save();
  }
  function openSetEditor(existing, returnTo, newKind) {
    draft = existing
      ? { id: existing.id, name: existing.name, items: existing.items.slice(), aim: existing.aim, errMax: existing.errMax, returnTo,
          kind: existing.kind || "letters", cons: (existing.cons || []).slice(), vows: (existing.vows || []).slice(), off: [] }
      : { id: null, name: "", items: [], aim: DEFAULT_AIM, errMax: DEFAULT_ERR, returnTo, kind: newKind === "slides" ? "slides" : "letters", cons: [], vows: [], off: [] };
    if (draft.kind === "slides") draft.off = slideCombos(draft).filter((x) => !draft.items.includes(x));
    draft.softSeen = slideCombos(draft).filter((x) => x === "ce" || x === "ci");
    go("setEdit");
  }
  function readDraftFields() {
    if ($("setName")) draft.name = $("setName").value;
    if ($("setAim")) draft.aim = $("setAim").value;
    if ($("setErr")) draft.errMax = $("setErr").value;
  }
  function leaveSetEditor(savedId) {
    const back = draft.returnTo; draft = null;
    if (back && back.name === "student") {
      const stu = getStudent(back.id);
      if (savedId) { ui.startSet[back.id] = savedId; ui.chartSet[back.id] = savedId; if (stu) { stu.setup = Object.assign({}, stu.setup || {}, { setId: savedId, kind: setKind(getSet(savedId)) }); save(); } }
      go("student", { id: back.id });
    }
    else go("sets");
  }
  async function saveDraft() {
    readDraftFields();
    const items = draftItems(draft);
    if (!items.length) { tell(draft.kind === "slides" ? "Pick at least one consonant and one vowel, with at least one slide included." : "Tap at least one letter to include in the set."); return; }
    let name = draft.name.trim();
    if (!name) {
      const n = await askText("Name this set so you can choose it again for later timings.", "", "Save set");
      if (!n || !n.trim()) return;
      name = n.trim();
    }
    if (data.sets.some((s) => s.id !== draft.id && s.name.toLowerCase() === name.toLowerCase())) { tell(`There is already a set named "${name}". Choose a different name.`); return; }
    const aim = Math.max(1, Number(draft.aim) || DEFAULT_AIM), errMax = Math.max(0, Number(draft.errMax));
    const extra = draft.kind === "slides" ? { kind: "slides", cons: draft.cons.slice(), vows: draft.vows.slice() } : { kind: "letters" };
    let id = draft.id;
    if (id) Object.assign(getSet(id), { name, items, aim, errMax: isNaN(errMax) ? DEFAULT_ERR : errMax }, extra);
    else { id = uid(); data.sets.push(Object.assign({ id, name, items, aim, errMax: isNaN(errMax) ? DEFAULT_ERR : errMax, created: todayStr() }, extra)); }
    save();
    leaveSetEditor(id);
  }

  // ---------- render + events ----------
  function render() {
    const app = $("app");
    if (loading) { app.innerHTML = shell("", ""); return; }
    let html;
    if (view.name === "student") html = studentView();
    else if (view.name === "sets") html = setsView();
    else if (view.name === "setEdit" && draft) html = setEditView();
    else if (view.name === "data") html = dataView();
    else if (view.name === "backup") html = backupView();
    else if (view.name === "today") html = todayView();
    else if (view.name === "sprint" && ui.sprintResult) html = sprintView();
    else if (view.name === "run" && run) html = runView();
    else if (view.name === "results" && pending) html = resultsView();
    else { view = { name: "home" }; html = homeView(); }
    app.innerHTML = html;
    bind();
  }

  function bind() {
    document.querySelectorAll("[data-nav]").forEach((b) => b.onclick = () => go(b.dataset.nav));
    document.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => { if (b.dataset.openset) ui.chartSet[b.dataset.open] = b.dataset.openset; go("student", { id: b.dataset.open }); });
    document.querySelectorAll("[data-todaysort]").forEach((b) => b.onclick = () => { ui.todaySort = b.dataset.todaysort; render(); });
    document.querySelectorAll("[data-unhide]").forEach((b) => b.onclick = () => { const x = getStudent(b.dataset.unhide); if (x) { x.hidden = false; save(); render(); } });
    if ($("retrySave")) $("retrySave").onclick = () => save();
    if ($("qrOpen")) $("qrOpen").onclick = showQR;
    if ($("probeLen")) $("probeLen").onchange = (e) => { data.settings.probeLen = e.target.value; save(); };
    if ($("probeCount")) $("probeCount").onchange = (e) => { data.settings.probeCount = Number(e.target.value); save(); };
    document.querySelectorAll("[data-setting]").forEach((b) => b.onclick = () => {
      const k = b.dataset.setting, v = b.dataset.val;
      data.settings[k] = (k === "seconds" || k === "sprintSeconds") ? Number(v) : k === "showClues" ? v === "on" : v;
      save(); render();
    });

    if (view.name === "home") {
      const add = () => {
        const name = $("newName").value.trim();
        if (!name) { $("newName").focus(); return; }
        data.students.push({ id: uid(), name, sessions: [], phases: [] });
        save(); render(); $("newName").focus();
      };
      $("addStudent").onclick = add;
      $("newName").onkeydown = (e) => { if (e.key === "Enter") add(); };
    }

    if (view.name === "student") {
      const st = getStudent(view.id); if (!st) return;
      const setSetup = (k, v) => { st.setup = Object.assign({}, st.setup || {}); st.setup[k] = v; };
      if ($("startSet")) $("startSet").onchange = (e) => { ui.startSet[st.id] = e.target.value; ui.chartSet[st.id] = e.target.value; setSetup("setId", e.target.value); save(); render(); };
      document.querySelectorAll("[data-ssetting]").forEach((b) => b.onclick = () => {
        const k = b.dataset.ssetting, v = (k === "seconds" || k === "sprintSeconds") ? Number(b.dataset.val) : b.dataset.val;
        setSetup(k, v); data.settings[k] = v;   // also the starting choice for new students
        save(); render();
      });
      if ($("copySetup")) $("copySetup").onclick = () => copySetupDialog(st);
      if ($("chartSet")) $("chartSet").onchange = (e) => { ui.chartSet[st.id] = e.target.value; render(); };
      if ($("newSetFromStudent")) $("newSetFromStudent").onclick = () => openSetEditor(null, { name: "student", id: st.id }, kindOf(st));
      document.querySelectorAll("[data-kindpick]").forEach((b) => b.onclick = () => {
        st.setup = Object.assign({}, st.setup || {}, { kind: b.dataset.kindpick });
        delete ui.startSet[st.id]; delete ui.chartSet[st.id];
        save(); render();
      });
      if ($("startRun")) $("startRun").onclick = () => startRun(st.id, $("startSet").value);
      if ($("startPaper")) $("startPaper").onclick = () => startRun(st.id, $("startSet").value, false, $("paperProbe").value);
      if ($("probeGrade")) $("probeGrade").onchange = (e) => { st.grade = e.target.value; data.settings.probeGrade = e.target.value; save(); render(); };
      if ($("printProbe")) $("printProbe").onclick = (e) => printProbe(e.currentTarget, getSet($("startSet").value), $("probeGrade").value, st.name, st.id);
      if ($("stGrade")) $("stGrade").onchange = (e) => { st.grade = e.target.value || undefined; if (st.grade) data.settings.probeGrade = st.grade; save(); render(); };
      if ($("toggleHide")) $("toggleHide").onclick = async () => {
        if (!st.hidden && !(await ask(`Hide ${st.name}? Their timings stay saved, but they won't show on the Today page. You can unhide them from the bottom of the Students page.`, "Hide"))) return;
        st.hidden = !st.hidden; save(); render();
      };
      if ($("startSprint")) $("startSprint").onclick = () => startRun(st.id, $("sprintSet").value, true);
      if ($("sprintSet")) $("sprintSet").onchange = (e) => { ui.startSet[st.id] = e.target.value; ui.chartSet[st.id] = e.target.value; setSetup("setId", e.target.value); save(); render(); };
      if ($("chartPdf")) $("chartPdf").onclick = (e) => { const cs = getSet(e.currentTarget.dataset.set); busy(e.currentTarget, () => chartPdf(st, cs)); };
      if ($("toggleManual")) $("toggleManual").onclick = () => { ui.showManual = !ui.showManual; render(); };
      if ($("saveManual")) $("saveManual").onclick = () => {
        const c = Number($("mCorrect").value), e = Number($("mErrors").value || 0), date = $("mDate").value;
        if ($("mCorrect").value === "" || c < 0 || e < 0 || !date) { tell("Enter the date, the number correct, and the number of errors."); return; }
        const errorItems = {};
        $("mItems").value.toLowerCase().split(/[\s,]+/).filter(Boolean).forEach((k) => (errorItems[k] = (errorItems[k] || 0) + 1));
        saveSession({ sid: st.id, setId: $("startSet").value, seconds: Number($("mSec").value), correct: c, errors: e, errorItems, mode: "paper", manual: true }, date);
        ui.showManual = false; render();
      };
      if ($("addPhase")) $("addPhase").onclick = () => {
        const date = $("pDate").value; if (!date) return;
        const setId = ui.chartSet[st.id] || $("startSet").value;
        const cs = getSet(setId) ? setId : $("startSet").value;
        st.phases.push({ id: uid(), setId: cs, date, note: $("pNote").value.trim() });
        ui.chartSet[st.id] = cs; save(); render();
      };
      document.querySelectorAll("[data-delphase]").forEach((b) => b.onclick = async () => {
        if (await ask("Remove this phase change line?", "Remove", true)) { st.phases = st.phases.filter((p) => p.id !== b.dataset.delphase); save(); render(); }
      });
      document.querySelectorAll("[data-delsession]").forEach((b) => b.onclick = async () => {
        if (await ask("Delete this timing? It will be removed from the chart.", "Delete", true)) { st.sessions = st.sessions.filter((x) => x.id !== b.dataset.delsession); save(); render(); }
      });
      $("rename").onclick = async () => { const n = await askText("Student name", st.name); if (n && n.trim()) { st.name = n.trim(); save(); render(); } };
      $("delStudent").onclick = async () => {
        if (await ask(`Remove ${st.name} and all of their timings? This cannot be undone.`, "Remove", true)) { data.students = data.students.filter((x) => x.id !== st.id); save(); go("home"); }
      };
    }

    if (view.name === "sets") {
      $("newSet").onclick = () => openSetEditor(null, { name: "sets" });
      if ($("probeGradeSets")) $("probeGradeSets").onchange = (e) => { data.settings.probeGrade = e.target.value; save(); };
      document.querySelectorAll("[data-probeset]").forEach((b) => b.onclick = () => printProbe(b, getSet(b.dataset.probeset), $("probeGradeSets").value, ""));
      document.querySelectorAll("[data-editset]").forEach((b) => b.onclick = () => openSetEditor(getSet(b.dataset.editset), { name: "sets" }));
      document.querySelectorAll("[data-copyset]").forEach((b) => b.onclick = () => {
        const s = getSet(b.dataset.copyset);
        openSetEditor(null, { name: "sets" });
        Object.assign(draft, { name: s.name + " (copy)", items: s.items.slice(), aim: s.aim, errMax: s.errMax, kind: s.kind || "letters", cons: (s.cons || []).slice(), vows: (s.vows || []).slice() });
        if (draft.kind === "slides") draft.off = slideCombos(draft).filter((x) => !draft.items.includes(x));
        draft.softSeen = slideCombos(draft).filter((x) => x === "ce" || x === "ci");
        render();
      });
      document.querySelectorAll("[data-delset]").forEach((b) => b.onclick = async () => {
        const s = getSet(b.dataset.delset);
        const n = data.students.reduce((k, st) => k + st.sessions.filter((x) => x.setId === s.id).length, 0);
        if (await ask(`Delete the set "${s.name}"?${n ? ` Its ${n} saved timing${n === 1 ? "" : "s"} and phase lines will be deleted too.` : ""}`, "Delete", true)) {
          data.sets = data.sets.filter((x) => x.id !== s.id);
          if (s.id === ALL_ID) data.settings.noAllLetters = true;
          data.students.forEach((st) => { st.sessions = st.sessions.filter((x) => x.setId !== s.id); st.phases = st.phases.filter((p) => p.setId !== s.id); });
          save(); render();
        }
      });
    }

    if (view.name === "setEdit") {
      document.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
        readDraftFields();
        const x = b.dataset.pick, i = draft.items.indexOf(x);
        if (i >= 0) draft.items.splice(i, 1); else draft.items.push(x);
        render();
      });
      document.querySelectorAll("[data-preset]").forEach((b) => b.onclick = () => {
        readDraftFields();
        const p = b.dataset.preset;
        draft.items = p === "bak1" ? BAK1.slice() : p === "all" ? LETTERS.slice() : p === "vowels" ? VOWELS.slice() : [];
        if (p === "bak1" && !draft.name.trim()) draft.name = "BAK 1 letters";
        render();
      });
      document.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => { readDraftFields(); draft.kind = b.dataset.kind; render(); });
      const toggle = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); else arr.push(x); };
      // ce and ci make a soft c, so they start out left out (once each; the teacher can put them back)
      const softC = () => { draft.softSeen = draft.softSeen || []; slideCombos(draft).forEach((x) => { if ((x === "ce" || x === "ci") && !draft.softSeen.includes(x)) { draft.softSeen.push(x); if (!draft.off.includes(x)) draft.off.push(x); } }); };
      document.querySelectorAll("[data-pickc]").forEach((b) => b.onclick = () => { readDraftFields(); toggle(draft.cons, b.dataset.pickc); softC(); render(); });
      document.querySelectorAll("[data-pickv]").forEach((b) => b.onclick = () => { readDraftFields(); toggle(draft.vows, b.dataset.pickv); softC(); render(); });
      document.querySelectorAll("[data-slide]").forEach((b) => b.onclick = () => { readDraftFields(); toggle(draft.off, b.dataset.slide); render(); });
      document.querySelectorAll("[data-cpreset]").forEach((b) => b.onclick = () => {
        readDraftFields();
        draft.cons = b.dataset.cpreset === "bak1" ? BAK1.filter((l) => !VOWELS.includes(l)) : [];
        softC(); render();
      });
      $("saveSet").onclick = saveDraft;
      $("cancelSet").onclick = $("cancelSet2").onclick = () => leaveSetEditor(null);
    }

    if (view.name === "data") {
      $("saveSettings").onclick = () => { const v = Number($("minCel").value); if (v >= 1) { data.settings.minCel = v; save(); tell("Saved."); } else tell("Enter a number of 1 or more, such as 1.25."); };
      $("eraseAll").onclick = async () => {
        if (await ask("Erase all students, timings, and letter sets? Download a backup first if you may need them.", "Erase all", true)) {
          data = { students: [], sets: [], probes: [], settings: Object.assign({}, DEFAULTS) }; ensureDefaultSets(); save(); go("home");
        }
      };
    }

    if (view.name === "backup") {
      $("backup").onclick = backupDownload;
      if ($("driveBackup")) $("driveBackup").onclick = (e) => backupToDrive(e.currentTarget);
      $("csv").onclick = () => {
        const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
        const lines = [["Student", "Set", "Date", "Seconds", "Correct", "Errors", "Correct per minute", "Errors per minute", "Error letters"].map(q).join(",")];
        sortedStudents().forEach((st) => st.sessions.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach((s) => {
          const set = getSet(s.setId);
          lines.push([st.name, set ? set.name : s.setName, s.date, s.seconds, s.correct, s.errors, r1(perMin(s.correct, s.seconds)), r1(perMin(s.errors, s.seconds)),
            Object.entries(s.errorItems || {}).map(([k, v]) => v > 1 ? `${k} x${v}` : k).join(" ")].map(q).join(","));
        }));
        download(`celeration-station-timings-${todayStr()}.csv`, lines.join("\n"), "text/csv");
      };
      $("restoreBtn").onclick = () => $("restoreFile").click();
      $("restoreFile").onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = async () => {
          e.target.value = "";
          try {
            const inc = normalize(JSON.parse(rd.result));
            let addS = 0, addT = 0, addSets = 0;
            inc.sets.forEach((s) => { if (!getSet(s.id)) { data.sets.push(s); addSets++; } });
            const haveP = new Set((data.probes || []).map((x) => x.id));
            data.probes = (data.probes || []).concat((inc.probes || []).filter((x) => !haveP.has(x.id)));
            inc.students.forEach((s) => {
              const cur = getStudent(s.id);
              if (!cur) { data.students.push(s); addS++; addT += s.sessions.length; return; }
              const have = new Set(cur.sessions.map((x) => x.id));
              s.sessions.forEach((x) => { if (!have.has(x.id)) { cur.sessions.push(x); addT++; } });
              const hp = new Set(cur.phases.map((x) => x.id));
              s.phases.forEach((x) => { if (!hp.has(x.id)) cur.phases.push(x); });
            });
            save(); render();
            tell(`Added ${addS} student${addS === 1 ? "" : "s"}, ${addT} timing${addT === 1 ? "" : "s"}, and ${addSets} letter set${addSets === 1 ? "" : "s"}. Nothing already here was removed.`);
          } catch (err) { tell("That file is not a backup from this app."); }
        };
        rd.readAsText(f);
      };
    }

    if (view.name === "run" && run) {
      $("cancelRun").onclick = async () => {
        const wasRunning = run.state === "running";
        if (run.state === "ready" || await ask("Cancel this timing? Nothing will be saved.", "Cancel timing", true)) {
          stopTimer(); const sid = run.sid; run = null; go("student", { id: sid });
        } else if (wasRunning && run && run.state === "running" && run.remaining <= 0) timeUp();
      };
      if ($("go")) $("go").onclick = beginTiming;
      if ($("timeupOk")) { $("timeupOk").focus(); $("timeupOk").onclick = () => { run.flash = false; render(); }; }
      if ($("timeupBox")) $("timeupBox").onclick = (e) => { if (e.target.id === "timeupBox") { run.flash = false; render(); } };
      if ($("undoMark")) $("undoMark").onclick = () => { const i = run.markOrder.pop(); if (i !== undefined) run.errors.delete(i); render(); };
      if ($("markYes")) $("markYes").onclick = () => markCard(true);
      if ($("markNo")) $("markNo").onclick = () => markCard(false);
      if ($("undoCard")) $("undoCard").onclick = undoCard;
      document.querySelectorAll("[data-cell]").forEach((b) => b.onclick = () => {
        const i = Number(b.dataset.cell);
        if (run.state === "running" || (run.state === "review" && run.tap === "errors")) {
          if (run.errors.has(i)) { run.errors.delete(i); run.markOrder = run.markOrder.filter((x) => x !== i); }
          else { run.errors.add(i); run.markOrder.push(i); }
        } else if (run.state === "review") run.last = i;
        render();
      });
      document.querySelectorAll("[data-tap]").forEach((b) => b.onclick = () => { run.tap = b.dataset.tap; render(); });
      if ($("prevPage")) $("prevPage").onclick = () => { if (run.page > 0) { run.page--; render(); } };
      if ($("nextPage")) $("nextPage").onclick = () => {
        const PG = run.pageSize || PAGE;
        if (run.paper) { if ((run.page + 1) * PG < run.items.length) { run.page++; render(); } return; }
        run.page++;
        if ((run.page + 1) * PG > run.items.length) run.items = run.items.concat(sequence(getSet(run.setId).items, PG * 2, run.items[run.items.length - 1]));
        render();
      };
      if ($("toResults")) $("toResults").onclick = () => { if (run.last === null) { run.tap = "last"; render(); return; } finishSheet(); };
    }

    if (view.name === "sprint" && ui.sprintResult) {
      $("againSprint").onclick = () => startRun(ui.sprintResult.sid, ui.sprintResult.setId, true);
    }

    if (view.name === "results" && pending) {
      $("saveResult").onclick = () => {
        const date = $("rDate").value || todayStr();
        const sid = pending.sid; saveSession(pending, date); pending = null; go("student", { id: sid });
      };
      $("discard").onclick = async () => {
        if (await ask("Discard this timing?", "Discard", true)) { const sid = pending.sid; pending = null; go("student", { id: sid }); }
      };
    }
  }

  document.addEventListener("keydown", (e) => {
    if (view.name !== "run" || !run || run.mode !== "cards" || run.state !== "running" || $("modal")) return;
    const k = e.key.toLowerCase();
    if (k === "arrowright" || k === "c") { e.preventDefault(); markCard(true); }
    else if (k === "arrowleft" || k === "x") { e.preventDefault(); markCard(false); }
    else if (k === "backspace") { e.preventDefault(); undoCard(); }
  });

  init();
})();
</script>
</body>
</html>
